# Sample ITSM connector config for AzLocal.UpdateManagement
# Reference: AzLocal.UpdateManagement/ITSM/ITSM-Config-Reference.md
# Setup guide: AzLocal.UpdateManagement/ITSM/README.md
schemaVersion: 1

# ----- Authentication -----
secrets:
  source: keyvault                 # 'keyvault' | 'envvar' | 'mixed'
  keyvaultName: corp-prod-kv-01    # required when source = keyvault
  servicenow:
    clientId: sn-azlocal-clientid
    clientSecret: sn-azlocal-clientsecret
    instanceUrl: env://ITSM_SN_INSTANCE_URL   # never a secret; kept here for parity

# ----- Default target -----
defaults:
  itsmTarget: ServiceNow
  assignmentGroup: AzureLocal-Ops
  callerId: svc-azlocal-cicd@contoso.com
  category: Compute / Azure Local
  templates:
    titleTemplate: "[Azure Local] {{cluster.name}} - {{trigger.category}} ({{run.updateName}})"
    bodyTemplatePath: ./templates/incident-body.md

# ----- Trigger matrix -----
triggers:
  Failed:
    raiseTicket: true
    severity: 2
    category: "Cluster update failure"
  Error:
    raiseTicket: true
    severity: 2
    category: "Cluster update failure"
  HealthCheckBlocked:
    raiseTicket: true
    severity: 3
    category: "Pre-update health resolution"
  SideloadedBlocked:
    raiseTicket: true
    severity: 4
    category: "Operator action: stage sideloaded payload"
  ExcludedByTag:
    raiseTicket: false   # operator deliberately set UpdateExcluded=True; no ticket by default. Opt-in if you want an audit-trail ticket per excluded cluster per run.
  ScheduleBlocked:
    raiseTicket: false   # schedule-blocked self-resolves; opt-in if you want a ticket
  Skipped:
    raiseTicket: false
  NotReady:
    raiseTicket: false

  # ----- Update: 4 - Monitor In-Flight Updates statuses (v0.8.87) -----
  # Emitted by Export-AzLocalUpdateRunMonitorReport in update-monitor.xml.
  # Wire monitor-updates.yml with raise_itsm_ticket=true to open tickets for
  # these. Dedupe key = SHA256(ClusterResourceId|UpdateName|TriggerCategory),
  # so a stuck/attempt-gap cluster opens at most ONE incident until it clears.
  AttemptWithoutRun:
    raiseTicket: true
    severity: 3
    category: "Update attempt with no observable updateRun"   # UpdateLastAttempt tag set, but no updateRun materialised (commonly a URP package pre-install health-check failure)
  StepError:
    raiseTicket: true
    severity: 2
    category: "Update step stuck in error"                    # progress.status == Error while state is still InProgress
  Stalled:
    raiseTicket: true
    severity: 2
    category: "Update run stalled / orphaned"                 # InProgress run whose ARM lastUpdatedTime has frozen past the stalled-no-progress threshold (orchestrator likely died mid-step)
  LongRunningOverall:
    raiseTicket: false   # informational backstop; opt-in if you want a ticket per run exceeding the overall-elapsed threshold
  LongRunningStep:
    raiseTicket: false   # informational; opt-in if you want a ticket per run whose current step exceeds the per-step threshold
