# AZLOCAL-PIPELINE-ID: manage-updatering-tags
# Manage UpdateRing Tags
# This workflow creates or updates UpdateRing tags on Azure Local clusters from a CSV file
#
# AUTHENTICATION OPTIONS:
# This workflow supports two authentication methods:
# 1. OpenID Connect (OIDC) - RECOMMENDED - No secrets, uses federated credentials
# 2. Client Secret - LEGACY - Requires AZURE_CLIENT_SECRET (see commented section)
#
# For OIDC setup, see: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
#
# WORKFLOW:
#   1. Run the "Inventory Azure Local Clusters" workflow first
#   2. Download the CSV artifact from that workflow run
#   3. Edit the CSV in Excel - populate the 'UpdateRing' column with values (e.g., Wave1, Wave2, Production)
#   4. Commit the edited CSV to your repository (e.g., to a 'config/' folder)
#   5. Run this workflow and specify the path to your committed CSV file
#
# NOTE: GitHub Actions does not support file uploads as workflow inputs.
#       The edited CSV must be committed to the repository first.

# Workflow name carries the same Setup prefix as the filename so the GitHub
# Actions sidebar (which sorts workflows alphabetically by this `name:` field)
# lists the setup and operational pipelines in execution order.
name: 'Config: 2 - Manage UpdateRing Tags'

on:
  # BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
  # Add `schedule:` cron blocks here to enable automated runs, e.g.:
  #   schedule:
  #     - cron: '0 6 * * 1'  # Mondays at 06:00 UTC
  # Content between BEGIN/END markers is preserved by
  # Update-AzLocalPipelineExample across module upgrades.
  # END-AZLOCAL-CUSTOMIZE:schedule-triggers

  workflow_dispatch:
    inputs:
      csv_file_path:
        description: 'Path to edited CSV file in repository (e.g., config/ClusterInventory_Updated.csv)'
        required: true
        default: 'config/ClusterUpdateRings.csv'
      force_overwrite:
        description: 'Force overwrite existing UpdateRing tags'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Preview changes without applying (WhatIf mode)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      module_version:
        description: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
        required: false
        default: ''

env:
  # Module version this workflow YAML was generated against. The install step compares
  # this to the version actually installed and to the latest on PSGallery, and emits a
  # ::notice annotation if the YAML appears stale - prompting you to refresh via
  # Copy-AzLocalPipelineExample -Update. See Automation-Pipeline-Examples/README.md section 5.
  GENERATED_AGAINST_MODULE_VERSION: '0.9.22'
  # Resolution order for the module version pin (leave all unset to install the latest,
  # which is the default "fix-forward" behaviour): manual workflow_dispatch input >
  # repository variable 'REQUIRED_MODULE_VERSION' > empty (latest).
  REQUIRED_MODULE_VERSION: ${{ github.event.inputs.module_version || vars.REQUIRED_MODULE_VERSION || '' }}
  # v0.8.4 - opt this workflow into Node.js 24 for all JavaScript actions
  # (actions/checkout, actions/download-artifact, actions/upload-artifact,
  # azure/login, dorny/test-reporter, etc). Per GitHub's 2025-09-19 deprecation
  # notice Node 20 is forced off by default on 2026-06-16 and removed from the
  # runner on 2026-09-16. Setting this env var silences the deprecation warnings
  # and exercises Node 24 ahead of the cut-over. To temporarily opt back out,
  # set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # v0.9.1 - OPTIONAL subscription exclusion list. Create a repository (or org)
  # Actions variable named AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH whose value is the
  # repo-relative path to your exclusion CSV (e.g. ./config/Excluded-Subscription-Ids.csv).
  # When set, every AzLocal.UpdateManagement Azure Resource Graph query in this
  # workflow excludes the listed subscriptions. Leave it unset to exclude nothing.
  AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH: ${{ vars.AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH }}

jobs:
  manage-tags:
    name: Manage UpdateRing Tags
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-manage-tags
    runs-on: windows-latest
    # END-AZLOCAL-CUSTOMIZE:runner-target-manage-tags
    # Required for OIDC authentication
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    # OPTION 1: OpenID Connect (OIDC) - RECOMMENDED
    # No client secret required - uses federated credentials
    - name: Azure CLI Login (OIDC)
      id: azure_login
      # v0.9.1: OIDC token exchange / `az login` can transiently fail
      # ("JSON is invalid: Expecting value" / az exit code 1). Let this first
      # attempt fail soft so the retry step below can try once more before the
      # job fails.
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        # AZURE_SUBSCRIPTION_ID is a repository *Variable* (vars.*), not a Secret. It
        # is consumed ONLY here: azure/login@v3 runs `az account set --subscription
        # <id>` after the OIDC token exchange so the runner has a default
        # `az account` context. It is NOT used to scope Azure Resource Graph queries
        # (those run fleet-wide across every subscription the federated identity can
        # read) and is NOT interpolated into Azure portal deep-link URLs (those use
        # the per-row `subscriptionId` returned by ARG).
        # Set it via: gh variable set AZURE_SUBSCRIPTION_ID --body <subId>
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    # v0.9.1: single automatic retry for the transient login failure above. Runs
    # only when the first attempt failed.
    # v0.9.12: this retry is now ALSO soft (continue-on-error). Both login
    # attempts failing - OR succeeding but yielding zero visible subscriptions
    # (the cryptic "No subscriptions found for ***") - is caught by the dedicated
    # "Verify Azure subscription access" gate below, which fails the job with a
    # clear, run-summary-visible remediation message instead of a raw az error.
    - name: Azure CLI Login (OIDC) - retry
      id: azure_login_retry
      if: steps.azure_login.outcome == 'failure'
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
    # OPTION 2: Client Secret - LEGACY (uncomment if OIDC not available)
    # - name: Azure CLI Login (Client Secret)
    #   uses: azure/login@v3
    #   with:
    #     creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ vars.AZURE_TENANT_ID }}"}'
    
    - name: Validate CSV File Exists
      shell: pwsh
      env:
        INPUT_CSV_FILE_PATH: ${{ github.event.inputs.csv_file_path }}
      # v0.8.5 thin-YAML: the existence + missing-file operator messaging is
      # now produced by Set-AzLocalClusterUpdateRingTagFromCsv itself. This
      # step still runs first to fail fast (and to surface the path) before
      # we spend time installing the module.
      run: |
        $csvPath = $env:INPUT_CSV_FILE_PATH
        if (-not (Test-Path $csvPath)) {
            Write-Host "ERROR: CSV file not found at path: $csvPath" -ForegroundColor Red
            Write-Host "The full TWO-STAGE operator workflow guidance will be emitted by"
            Write-Host "Set-AzLocalClusterUpdateRingTagFromCsv when the Apply step runs."
            Write-Host ""
            Write-Host "Quick recap:"
            Write-Host "  1. Run Step.1 (Inventory) and download/edit/commit the CSV."
            Write-Host "  2. Re-run this Step.2 with csv_file_path pointing to the committed CSV."
            Write-Host ""
            Write-Host "Docs:"
            Write-Host "  AzLocal.UpdateManagement/README.md - 'Update Rings' section"
            Write-Host "  AzLocal.UpdateManagement/Automation-Pipeline-Examples/README.md"
            exit 1
        }
        Write-Host "Found CSV file: $csvPath"
        echo "CSV_PATH=$csvPath" >> $env:GITHUB_OUTPUT
      id: csv-path

    - name: Install AzLocal.UpdateManagement from PSGallery
      # v0.8.5 thin-YAML: drift detection + banner + step outputs are all
      # produced by Add-AzLocalPipelineVersionBanner (Public cmdlet).
      shell: pwsh
      id: module-version
      run: |
        $ErrorActionPreference = 'Stop'
        $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
        if ($env:REQUIRED_MODULE_VERSION) {
            $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
            Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
        } else {
            Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
        }
        # Transient PSGallery lookups can intermittently fail with "No match was found
        # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
        # (a PSGallery search index / publish-propagation blip). Retry the install up
        # to 25 attempts (~25 min) with capped exponential backoff + jitter (10s, 20s, 40s, 60s cap) to ride out a prolonged PSGallery search-index outage in a single run.
        $installMaxAttempts = 25
        $installAttempt = 0
        while ($true) {
            $installAttempt++
            try {
                Install-Module @installArgs
                break
            } catch {
                if ($installAttempt -ge $installMaxAttempts) {
                    Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                    throw
                }
                $installRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $installAttempt - 1)) + (Get-Random -Minimum 0 -Maximum 5)
                Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                Start-Sleep -Seconds $installRetryDelay
            }
        }
        Import-Module AzLocal.UpdateManagement -Force
        Add-AzLocalPipelineVersionBanner `
            -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
            -PinnedVersion $env:REQUIRED_MODULE_VERSION

    # v0.9.12: fail EARLY with a run-summary-visible message when the pipeline
    # identity can see no Azure subscriptions. Because both azure/login attempts
    # above are now soft, this is the job's hard authentication/authorization gate
    # (tag resolution across the fleet needs at least one accessible subscription).
    - name: Verify Azure subscription access
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force
        Assert-AzLocalAzureSubscriptionAccess

    - name: Apply UpdateRing Tags
      id: apply-tags
      shell: pwsh
      env:
        INPUT_CSV_FILE_PATH:      ${{ steps.csv-path.outputs.CSV_PATH }}
        INPUT_FORCE_OVERWRITE:    ${{ github.event.inputs.force_overwrite }}
        INPUT_DRY_RUN:            ${{ github.event.inputs.dry_run }}
        INSTALLED_MODULE_VERSION: ${{ steps.module-version.outputs.installed_module_version }}
      # v0.8.5 thin-YAML: the inline run block (CSV column validation,
      # Set-AzLocalClusterUpdateRingTag invocation, JSON sidecar write,
      # outcome tallies, and the GITHUB_STEP_SUMMARY breakdown) has been
      # condensed into the Public cmdlet
      # Set-AzLocalClusterUpdateRingTagFromCsv. The cmdlet writes
      # UpdateRingTag_Results.json to -OutputDirectory, emits the markdown
      # step summary via GITHUB_STEP_SUMMARY, and sets the eight step
      # outputs (total_count, created_count, updated_count,
      # already_in_sync_count, skipped_count, failed_count, whatif_count,
      # results_json_path).
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force
        $forceOverwrite = $env:INPUT_FORCE_OVERWRITE -eq 'true'
        $dryRun         = $env:INPUT_DRY_RUN -eq 'true'
        $params = @{
            InputCsvPath           = $env:INPUT_CSV_FILE_PATH
            OutputDirectory        = './artifacts'
            InstalledModuleVersion = $env:INSTALLED_MODULE_VERSION
        }
        if ($forceOverwrite) { $params['Force']  = $true }
        if ($dryRun)         { $params['WhatIf'] = $true }
        Set-AzLocalClusterUpdateRingTagFromCsv @params

    - name: Compute Artifact Timestamp
      id: artifact-stamp
      shell: pwsh
      # every downloadable artifact gets a UTC timestamp suffix so multiple runs on
      # the same day produce distinct zip names.
      run: |
        $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
        "timestamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Artifact timestamp: $stamp"

    - name: Upload Log Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: azlocal-updatering-tag-logs_${{ steps.artifact-stamp.outputs.timestamp }}
        path: ./artifacts/*
        retention-days: 30

    # v0.9.18: render the support disclaimer at the very bottom of the run summary.
    - name: Support disclaimer
      if: always()
      continue-on-error: true
      shell: pwsh
      run: |
        Import-Module AzLocal.UpdateManagement -Force
        Add-AzLocalPipelineSupportFooter

