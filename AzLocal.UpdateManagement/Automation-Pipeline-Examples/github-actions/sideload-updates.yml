# AZLOCAL-PIPELINE-ID: sideload-updates
# Sideload Updates (Opt-in, on-prem self-hosted runner)
#
# OPT-IN, OFF BY DEFAULT. This workflow automates the on-prem sideloading of
# Azure Local solution-update media for clusters that cannot pull updates from
# Azure directly. It is the NEW Step.6 introduced in v0.8.7; the former Step.6
# (Apply Updates) is now Step.7.
#
# WHY A SELF-HOSTED RUNNER:
#   The runner must sit on the SAME network as the target Azure Local clusters
#   so it can (a) Robocopy the CombinedSolutionBundle to each cluster's
#   infrastructure `import` SMB share and (b) PowerShell-remote (WinRM) into a
#   cluster node to verify the SHA256 and run Add-SolutionUpdate. GitHub-hosted
#   runners cannot reach the on-prem fabric, so this pipeline targets a
#   self-hosted runner labelled `azlocal-sideload`.
#
# RE-ENTRANT STATE MACHINE:
#   Each run advances every in-scope cluster by ONE state transition and exits.
#   The multi-hour copy itself runs in a detached Windows Scheduled Task, so no
#   pipeline run is ever long-lived. Drive this on a frequent CRON (e.g. every
#   30 minutes) so the state machine progresses Copying -> Copied -> Verified ->
#   Imported across successive short runs. Re-running is always safe.
#
# GATE: the self-hosted job runs only when
#   config/sideload-settings.yml has enabled: true.
#
# AUTHENTICATION:
#   - Azure (ARG fleet read + Key Vault secret read + UpdateSideloaded tag flip):
#     azure/login OIDC by default. enable-AzPSSession=true is REQUIRED because
#     the Key Vault secrets are read via Get-AzKeyVaultSecret (Az PowerShell).
#     Alternative authentication modes are configured in sideload-settings.yml.
#   - Cluster WinRM remoting: an Active Directory [pscredential] built from two
#     Key Vault secrets named in the sideload auth-map row (NOT the pipeline
#     identity). The detached copy Scheduled Task runs as the runner service
#     account (needs UNC rights to the shared cache + cluster import share).

# Workflow name carries the same Step.N - prefix as the filename so the GitHub
# Actions sidebar (which sorts workflows alphabetically by this `name:` field)
# lists the pipelines in execution order.
name: 'Update: 2 - Sideload Updates (Opt-in)'

on:
  # BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
  # Edits inside this block are preserved across Update-AzLocalPipelineExample
  # module upgrades.
  #
  # NO default schedule ships out-of-the-box (this pipeline requires an on-prem
  # self-hosted runner that most repos do not have). Once your `azlocal-sideload`
  # runner is online, UNCOMMENT the cron below to drive the re-entrant state
  # machine. A frequent poll (every 30 min) lets a single short run advance the
  # multi-hour copy without staying alive. The Step.3 schedule-coverage audit can
  # recommend a lead-time-aware cron using planning.leadDays.
  #
  # schedule:
  #   - cron: '*/30 * * * *'   # every 30 minutes - advance/report sideload state
  # END-AZLOCAL-CUSTOMIZE:schedule-triggers

  workflow_dispatch:
    inputs:
      update_ring:
        # accepts a single ring (Wave1), a semicolon-delimited list (Prod;Ring2),
        # or '***' (three stars - deliberate, not a typo) to match every cluster
        # that HAS the UpdateRing tag set.
        description: "UpdateRing tag value to scope the plan ('Wave1', 'Prod;Ring2', or '***' for ALL rings)."
        required: false
        default: '***'
      dry_run:
        description: 'Preview the plan + transitions without staging media, registering tasks, or flipping tags (WhatIf).'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      module_version:
        description: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
        required: false
        default: ''

env:
  # Module version this workflow YAML was generated against. The install step compares
  # this to the version actually installed and to the latest on PSGallery, and emits a
  # ::notice annotation if the YAML appears stale - prompting you to refresh via
  # Copy-AzLocalPipelineExample -Update. See Automation-Pipeline-Examples/README.md section 5.
  GENERATED_AGAINST_MODULE_VERSION: '0.9.22'
  # Resolution order for the module version pin (leave all unset to install the latest,
  # which is the default "fix-forward" behaviour): manual workflow_dispatch input >
  # repository variable 'REQUIRED_MODULE_VERSION' > empty (latest).
  REQUIRED_MODULE_VERSION: ${{ github.event.inputs.module_version || vars.REQUIRED_MODULE_VERSION || '' }}
  # v0.8.4 - opt this workflow into Node.js 24 for all JavaScript actions
  # (actions/checkout, actions/download-artifact, actions/upload-artifact,
  # azure/login, dorny/test-reporter, etc). Per GitHub's 2025-09-19 deprecation
  # notice Node 20 is forced off by default on 2026-06-16 and removed from the
  # runner on 2026-09-16. Setting this env var silences the deprecation warnings
  # and exercises Node 24 ahead of the cut-over. To temporarily opt back out,
  # set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # v0.9.1 - OPTIONAL subscription exclusion list. Create a repository (or org)
  # Actions variable named AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH whose value is the
  # repo-relative path to your exclusion CSV (e.g. ./config/Excluded-Subscription-Ids.csv).
  # When set, every AzLocal.UpdateManagement Azure Resource Graph query in this
  # workflow excludes the listed subscriptions. Leave it unset to exclude nothing.
  AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH: ${{ vars.AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH }}

# Prevent overlapping sideload runs from racing on the same shared state.
# cancel-in-progress=false queues a newly-triggered run behind an in-flight one.
concurrency:
  group: sideload-updates-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # PREFLIGHT (always runs on a Microsoft-hosted Windows runner)
  # ---------------------------------------------------------------------------
  # Purpose: explain - in the run step summary - WHY the `sideload` job did or
  # did not run, so an operator who triggers Step.6 without first completing
  # the opt-in setup sees a clear "what to do next" panel instead of a silent
  # "Skipped" status (the symptom that prompted v0.8.76).
  #
  # Cost: ~10s on windows-latest. No Azure/Key Vault access. Always runs.
  #
  # Outcomes:
  #   - Gate OFF (config/sideload-settings.yml has enabled: false):
  #       preflight succeeds (exit 0) with an informational panel showing how
  #       to enable Step.6. The `sideload` job is then SKIPPED by its own `if:`.
  #   - Gate ON + paths.stateRoot missing: preflight FAILS (exit 1) with
  #       a panel listing the missing variable(s). The `sideload` job is
  #       skipped because its `needs: preflight` is unmet.
  #   - Gate ON + best-effort runner check shows no online `azlocal-sideload`
  #       runner: preflight FAILS (exit 1). NOTE: the runner enumeration API
  #       requires repo-admin permission which GITHUB_TOKEN does not normally
  #       grant; if the API call fails with 403/404 the preflight degrades
  #       gracefully and emits a strong warning instead of a hard failure.
  #   - All checks pass: preflight succeeds, `sideload` job proceeds.
  preflight:
    name: Step.6 Preflight - Validate Opt-in + Self-Hosted Runner
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-preflight
    runs-on: windows-latest
    # END-AZLOCAL-CUSTOMIZE:runner-target-preflight
    permissions:
      actions: read      # Best-effort runner enumeration (may 403 - graceful fallback)
      contents: read
    outputs:
      enabled: ${{ steps.settings.outputs.enabled }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Validate sideload settings
      id: settings
      shell: pwsh
      run: |
          $ErrorActionPreference = 'Stop'
          Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          Import-Module powershell-yaml -Force
          $path = './config/sideload-settings.yml'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Required sideload settings file not found: $path. Run Copy-AzLocalPipelineExample to create it."
          }
          $settings = ConvertFrom-Yaml -Yaml (Get-Content -LiteralPath $path -Raw) -Ordered:$false
          if ([int]$settings.schemaVersion -ne 1) {
            throw "Unsupported sideload settings schemaVersion '$($settings.schemaVersion)'; this workflow requires 1."
          }
          $enabled = [bool]$settings.enabled
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @(
            '## Step.6 - Sideload Updates - Preflight',
            '',
            "- Settings: ``$path`` (schema $($settings.schemaVersion))",
            "- Enabled: ``$enabled``",
            "- State root: ``$($settings.paths.stateRoot)``"
          )
          if (-not $enabled) {
            Write-Output '::notice title=Sideload disabled::Set enabled: true in config/sideload-settings.yml after completing the documented prerequisites.'
            exit 0
          }
          foreach ($required in @('stateRoot','authMap','catalog','applySchedule')) {
            if ([string]::IsNullOrWhiteSpace([string]$settings.paths[$required])) {
              throw "sideload-settings.yml paths.$required is required when enabled is true."
            }
          }
          $logonType = [string]$settings.identity.task.logonType
          if ($logonType -notin @('ServiceAccount','Password')) {
            throw "identity.task.logonType must be ServiceAccount or Password for UNC access."
          }
          if ([string]::IsNullOrWhiteSpace([string]$settings.identity.task.principalUserId)) {
            throw "identity.task.principalUserId is required when sideloading is enabled."
          }
          if ($logonType -eq 'Password') {
            foreach ($required in @('passwordKeyVaultName','passwordSecretName')) {
              if ([string]::IsNullOrWhiteSpace([string]$settings.identity.task[$required])) {
                throw "identity.task.$required is required when logonType is Password."
              }
            }
          }

  sideload:
    name: Advance Sideload State Machine
    # Wait for preflight to pass before queuing onto the self-hosted runner.
    # If preflight FAILS (missing config / no runner), this job is skipped.
    # If preflight succeeds with the gate OFF, this job is skipped by its own `if:`.
    needs: preflight
    # Requires an on-prem self-hosted RUNNER (GitHub Actions terminology) on the
    # same network as the clusters, registered with the `azlocal-sideload` label
    # (use a dedicated runner group to restrict which repos can target it).
    # BEGIN-AZLOCAL-CUSTOMIZE:sideload-runner-sideload
    runs-on: [self-hosted, azlocal-sideload]
    # END-AZLOCAL-CUSTOMIZE:sideload-runner-sideload
    if: ${{ needs.preflight.outputs.enabled == 'true' }}
    permissions:
      id-token: write
      contents: read
      checks: write  # Required for the test reporter

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # azure/login with enable-AzPSSession requires Az.Accounts to be available
    # before the action runs. Install every PowerShell prerequisite used by the
    # self-hosted job here so a clean runner does not depend on image state.
    - name: Install sideload PowerShell prerequisites
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $prerequisiteMaxAttempts = 25
        for ($prerequisiteAttempt = 1; $prerequisiteAttempt -le $prerequisiteMaxAttempts; $prerequisiteAttempt++) {
          try {
            Install-Module Az.Accounts -Scope CurrentUser -Force -AllowClobber
            Install-Module Az.KeyVault -Scope CurrentUser -Force -AllowClobber
            Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
            break
          } catch {
            if ($prerequisiteAttempt -ge $prerequisiteMaxAttempts) { throw }
            $prerequisiteRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $prerequisiteAttempt - 1)) + (Get-Random -Maximum 5)
            Write-Host "Prerequisite install attempt $prerequisiteAttempt of $prerequisiteMaxAttempts failed: $($_.Exception.Message). Retrying in $prerequisiteRetryDelay second(s)..."
            Start-Sleep -Seconds $prerequisiteRetryDelay
          }
        }

    # Azure auth. enable-AzPSSession=true sets up BOTH the az CLI context (ARG +
    # az rest tag writes) AND the Az PowerShell context (Get-AzKeyVaultSecret).
    #
    # identity.keyVaultAuth alternatives for on-prem runners where OIDC is not viable:
    #   - managedidentity: replace this step with
    #       run: Connect-AzAccount -Identity
    #   - serviceprincipal: store AZURE_CLIENT_SECRET as a repo secret and use
    #       azure/login with creds, or Connect-AzAccount -ServicePrincipal -Credential ...
    - name: Azure Login (OIDC + Az PowerShell session)
      id: azure_login
      # v0.9.1: OIDC token exchange / `az login` can transiently fail
      # ("JSON is invalid: Expecting value" / az exit code 1). Let this first
      # attempt fail soft so the retry step below can try once more before the
      # job fails.
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        enable-AzPSSession: true

    # v0.9.1: single automatic retry for the transient login failure above. Runs
    # only when the first attempt failed.
    # v0.9.12: this retry is now ALSO soft (continue-on-error); the dedicated
    # "Verify Azure subscription access" gate below is this job's single hard
    # authentication/authorization gate and fails with a clear summary message.
    - name: Azure Login (OIDC + Az PowerShell session) - retry
      id: azure_login_retry
      if: steps.azure_login.outcome == 'failure'
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        enable-AzPSSession: true

    - name: Install Azure CLI Resource Graph Extension
      shell: pwsh
      run: |
        az extension add --name resource-graph --yes

    - name: Install AzLocal.UpdateManagement from PSGallery
      shell: pwsh
      id: module-version
      run: |
        $ErrorActionPreference = 'Stop'
        $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
        if ($env:REQUIRED_MODULE_VERSION) {
            $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
            Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
        } else {
            Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
        }
        # Transient PSGallery lookups can intermittently fail with "No match was found
        # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
        # (a PSGallery search index / publish-propagation blip). Retry the install up
        # to 25 attempts (~25 min) with capped exponential backoff + jitter (10s, 20s, 40s, 60s cap) to ride out a prolonged PSGallery search-index outage in a single run.
        $installMaxAttempts = 25
        $installAttempt = 0
        while ($true) {
            $installAttempt++
            try {
                Install-Module @installArgs
                break
            } catch {
                if ($installAttempt -ge $installMaxAttempts) {
                    Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                    throw
                }
                $installRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $installAttempt - 1)) + (Get-Random -Minimum 0 -Maximum 5)
                Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                Start-Sleep -Seconds $installRetryDelay
            }
        }
        Import-Module AzLocal.UpdateManagement -Force
        Add-AzLocalPipelineVersionBanner `
            -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
            -PinnedVersion $env:REQUIRED_MODULE_VERSION

    # v0.9.12: fail EARLY with a run-summary-visible message when the pipeline
    # identity can see no Azure subscriptions. Because both azure/login attempts
    # above are now soft, this is the job's hard authentication/authorization
    # gate (sideload plan resolution reads the fleet via Resource Graph).
    - name: Verify Azure subscription access
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force
        Assert-AzLocalAzureSubscriptionAccess

    - name: Advance Sideload State Machine
      id: sideload
      shell: pwsh
      env:
        INPUT_UPDATE_RING: ${{ github.event.inputs.update_ring || '***' }}
        INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force

        $settings = Get-AzLocalSideloadSettings -Path './config/sideload-settings.yml'

        # 1. Resolve the per-cluster plan (read-only).
        $planParams = @{
            SchedulePath = [string]$settings.Paths.applySchedule
            AuthMapPath  = [string]$settings.Paths.authMap
            CatalogPath  = [string]$settings.Paths.catalog
            LeadDays     = [int]$settings.Planning.leadDays
        }
        if ($env:INPUT_UPDATE_RING) { $planParams['UpdateRingValue'] = $env:INPUT_UPDATE_RING }
        if ($settings.Remoting.fqdnSuffix) { $planParams['FqdnSuffix'] = [string]$settings.Remoting.fqdnSuffix }
        $plan = @(Resolve-AzLocalSideloadPlan @planParams)
        Write-Host ("Resolved {0} cluster plan row(s)." -f $plan.Count)

        # 2. Advance the re-entrant state machine by one transition per cluster.
        $applyParams = @{
            Plan         = $plan
            StateRoot    = [string]$settings.Paths.stateRoot
            HeartbeatSeconds = [int]$settings.Reconciliation.heartbeatIntervalSeconds
            HeartbeatStaleMinutes = [int]$settings.Reconciliation.heartbeatStaleMinutes
            NoProgressMinutes = [int]$settings.Reconciliation.noProgressMinutes
            MaxConcurrentCopies = [int]$settings.Reconciliation.maxConcurrentCopies
            MaxConcurrentCopiesPerRunner = [int]$settings.Reconciliation.maxConcurrentCopiesPerRunner
            TaskLogonType = [string]$settings.Identity.task.logonType
            TaskPrincipalUserId = [string]$settings.Identity.task.principalUserId
            ErrorAction  = 'Stop'
        }
          if ($settings.Paths.cacheRoot) { $applyParams['CacheRoot'] = [string]$settings.Paths.cacheRoot }
          $profile = $settings.Copy.profiles[[string]$settings.Copy.defaultProfile]
          $switches = @("/R:$($profile.retryCount)", "/W:$($profile.waitSeconds)")
          if ([int]$profile.interPacketGapMilliseconds -gt 0) { $switches += "/IPG:$($profile.interPacketGapMilliseconds)" }
          if ([bool]$profile.restartable) { $switches += '/Z' }
          if ([bool]$profile.unbuffered) { $switches += '/J' }
          $applyParams['RobocopySwitches'] = $switches -join ' '
        $taskPassword = $null
        if ([string]$settings.Identity.task.logonType -eq 'Password') {
          $taskSecret = Get-AzKeyVaultSecret -VaultName ([string]$settings.Identity.task.passwordKeyVaultName) -Name ([string]$settings.Identity.task.passwordSecretName) -ErrorAction Stop
          $taskPassword = $taskSecret.SecretValue
          $taskSecret = $null
          $applyParams['TaskPassword'] = $taskPassword
        }
        if ($env:INPUT_DRY_RUN -eq 'true') {
            $applyParams['WhatIf'] = $true
            Write-Host 'DRY RUN MODE - no media staged, no tasks registered, no tags flipped.'
        }
        try {
          $results = @(Invoke-AzLocalSideloadUpdate @applyParams)
        }
        finally {
          $taskPassword = $null
          $applyParams.Remove('TaskPassword')
        }
        Write-Host ("Processed {0} cluster(s)." -f $results.Count)

        # 3. Render the status report (markdown step summary + JUnit XML + sideload-status.md).
        New-Item -ItemType Directory -Path ./reports -Force | Out-Null
        $report = Add-AzLocalSideloadStepSummary -StateRoot ([string]$settings.Paths.stateRoot) -Plan $plan -OutputPath ./reports

        if ($report.HasFailures) {
            Write-Host '::warning::One or more clusters are in a Failed state or have plan errors - see the Sideload status report.'
        }

    # v0.9.12: fail with a clear, run-summary-visible message (instead of the
    # downstream publish step's misleading "No test report files were found")
    # when the sideload step reported success but wrote no JUnit report.
    - name: Verify diagnostic reports were produced
      if: steps.sideload.outcome == 'success'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force
        Assert-AzLocalPipelineReport -Path './reports/sideload-junit.xml' -ProducingStepName 'Advance Sideload State Machine'

    - name: Compute Artifact Timestamp
      if: always()
      id: artifact-stamp
      shell: pwsh
      # every downloadable artifact gets a UTC timestamp suffix so multiple runs on
      # the same day produce distinct zip names.
      run: |
        $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
        "timestamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Artifact timestamp: $stamp"

    - name: Upload Sideload Reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: azlocal-sideload-updates-report_${{ steps.artifact-stamp.outputs.timestamp }}
        path: ./reports/
        retention-days: 90

    - name: Publish Test Results
      uses: dorny/test-reporter@v3
      # v0.9.12: was `if: always()`; now success()-gated so it skips when an
      # upstream step failed - eliminating the misleading "No test report files
      # were found" cascade.
      if: success()
      with:
        name: Sideload Update Report
        path: ./reports/sideload-junit.xml
        reporter: java-junit
        fail-on-error: false
        list-suites: failed
        list-tests: failed

    # v0.9.18: render the support disclaimer at the very bottom of the run summary.
    - name: Support disclaimer
      if: always()
      continue-on-error: true
      shell: pwsh
      run: |
        Import-Module AzLocal.UpdateManagement -Force
        Add-AzLocalPipelineSupportFooter
