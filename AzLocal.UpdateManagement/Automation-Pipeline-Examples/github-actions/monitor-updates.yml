# AZLOCAL-PIPELINE-ID: monitor-updates
# Monitor In-Flight Updates (operational monitoring snapshot)
# -----------------------------------------------------------
# Reports clusters whose latest update run is currently in flight, with the
# CURRENT STEP each cluster is on and the ELAPSED DURATION of the run. Built
# for operators who want a 30-minute-cadence "what is happening right now"
# view, distinct from the daily Step.9 fleet-update-status snapshot which
# answers "is each cluster up-to-date?".
#
# This workflow is REPORT-ONLY and always succeeds. Long-running runs are
# surfaced via:
#   - The markdown step summary (sorted by elapsed duration descending, with
#     a Threshold column flagging runs that have exceeded the configured
#     long-running threshold).
#   - update-monitor.csv (full per-cluster rows for spreadsheet triage).
#   - update-monitor.xml (JUnit, one <testcase time="0"> per in-flight cluster;
#     <failure> when the elapsed duration exceeds the threshold so the
#     Checks tab shows stuck runs in red).
#
# Data source: Get-AzLocalUpdateRuns -Latest (one row per cluster). No new
# cmdlets required - this is a pure pipeline composition.

# Workflow name carries the same Step.N - prefix as the filename so the GitHub
# Actions sidebar (which sorts workflows alphabetically by this `name:` field)
# lists the pipelines in execution order.
name: 'Update: 4 - Monitor In-Flight Updates'

on:
  # BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
  # Content between BEGIN/END markers is preserved by
  # Update-AzLocalPipelineExample across module upgrades.
  #
  # Default (v0.8.90+): runs every 6 hours, 24x7 (00:00, 06:00, 12:00, 18:00
  # UTC) as a low-cost safety-net heartbeat. The snapshot step runs with
  # -SkipWhenIdle, so a heartbeat that finds nothing in flight short-circuits
  # after a single cheap Resource Graph probe (no per-cluster sweep) - which is
  # what makes a frequent cron affordable. The PRIMARY, low-latency trigger is
  # event-driven: Update: 3 (Apply Updates) fires this workflow as soon as it
  # starts >=1 update (see the apply-updates pipeline). GitHub Actions cron is
  # ALWAYS UTC - adjust below for your local maintenance window. Comment the
  # `schedule:` block out entirely to disable.
  #
  # Other typical patterns:
  #   '*/30 * * * *'         every 30 min, 24x7 (busiest)
  #   '0 */2 * * *'          every 2 hours, 24x7
  #   '0 0,2,4,20,22 * * *'  5x/day across an overnight maintenance window
  #   '*/30 * * * 0,6'       every 30 min, weekends only
  #   '*/15 22-6 * * 0,6'    every 15 min during the weekend maintenance window
  schedule:
    - cron: '0 */6 * * *'
  # END-AZLOCAL-CUSTOMIZE:schedule-triggers

  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of clusters to monitor'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'by-update-ring'
      update_ring:
        # accepts a single ring (Wave1), a semicolon-delimited list (Prod;Ring2),
        # or '***' (three stars - deliberate, not a typo) to match every cluster that HAS the UpdateRing tag set.
        description: "UpdateRing tag value (only used when scope=by-update-ring). Single ring, 'Prod;Ring2', or '***'."
        required: false
        default: ''
      long_running_step_hours:
        description: 'PRIMARY stuck-step signal. Flag in-flight runs whose CURRENT STEP has been running longer than this many hours (default 2). More accurate than overall-run elapsed for large clusters where a legitimate 12-node run can exceed 6-8h while each individual step ticks along normally.'
        required: false
        default: '2'
      long_running_threshold_hours:
        description: 'Belt-and-braces overall-elapsed flag (default 24h). Useful as a backstop for very long-stuck runs; per-step elapsed (long_running_step_hours) is the primary stuck-run signal.'
        required: false
        default: '24'
      recent_failure_window_hours:
        description: 'Surface FAILED runs whose End time falls within the last N hours (default 24). Set to 0 to disable.'
        required: false
        default: '24'
      critical_elapsed_days:
        description: 'CRITICAL tier for overall-elapsed (default 3 days). In-flight runs older than this get a :rotating_light: chip; older than 2x this get a :skull: chip. Strongest visual signal that human intervention is needed - a 19-day-stuck run will no longer be hidden behind a single "step errored" chip.'
        required: false
        default: '3'
      # v0.8.90: performance fast path. When 'true' (default) the snapshot runs
      # with -SkipWhenIdle - one cheap fleet-wide "anything in flight?" probe
      # that short-circuits to an IDLE report when nothing is updating, skipping
      # the per-cluster sweep. Set 'false' to force a full sweep even when idle.
      # NOTE: scheduled (cron) runs always behave as 'true' regardless of this
      # input, since workflow_dispatch inputs do not apply to schedule events.
      skip_when_idle:
        description: 'Skip the per-cluster sweep when no update runs are in flight (cheap probe only). Default true.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      # ITSM (ServiceNow) auto-ticketing - opt-in (v0.8.87). When enabled the
      # connector reads the update-monitor.xml this pipeline already produces and,
      # for each cluster whose Status matches the trigger matrix (default raises
      # for AttemptWithoutRun / StepError / Failed), opens a deduped incident.
      # Default 'false' so existing schedules stay byte-identical until you opt in.
      raise_itsm_ticket:
        description: 'Open ITSM tickets (ServiceNow) for in-flight monitor failures (stuck steps, failed runs, attempt-without-run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      itsm_config_path:
        description: 'Path to ITSM matrix config (YAML or JSON)'
        required: false
        default: './.itsm/azurelocal-itsm.yml'
      itsm_dry_run:
        description: 'ITSM: build payloads + run read-only dedupe but do NOT create tickets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      itsm_force_create:
        description: 'ITSM: bypass dedupe and always create new tickets (use with caution)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      module_version:
        description: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
        required: false
        default: ''
      # v0.8.90: machine-set markers for the event-driven trigger fired by
      # Update: 3 (Apply Updates). Operators normally leave these BLANK.
      # triggered_by=apply-updates is what enables the optional startup delay
      # (repository Variable MONITOR_TRIGGER_DELAY_MINUTES) so the monitor lands
      # AFTER updates have moved past their initial health-check phase. Cron and
      # manual runs leave it blank and therefore never delay. apply_run_id
      # back-links to the Apply run that fired this monitor (shown in the log).
      triggered_by:
        description: 'Marker set by the Apply pipeline for the event-driven trigger (leave blank for manual runs).'
        required: false
        default: ''
      apply_run_id:
        description: 'Run id of the Apply pipeline that triggered this monitor (back-link; leave blank for manual runs).'
        required: false
        default: ''

env:
  # Module version this workflow YAML was generated against. The install step compares
  # this to the version actually installed and to the latest on PSGallery, and emits a
  # ::notice annotation if the YAML appears stale - prompting you to refresh via
  # Copy-AzLocalPipelineExample -Update. See Automation-Pipeline-Examples/README.md section 5.
  GENERATED_AGAINST_MODULE_VERSION: '0.9.11'
  # Resolution order for the module version pin (leave all unset to install the latest,
  # which is the default "fix-forward" behaviour): manual workflow_dispatch input >
  # repository variable 'REQUIRED_MODULE_VERSION' > empty (latest).
  REQUIRED_MODULE_VERSION: ${{ github.event.inputs.module_version || vars.REQUIRED_MODULE_VERSION || '' }}
  # v0.8.4 - opt this workflow into Node.js 24 for all JavaScript actions
  # (actions/checkout, actions/download-artifact, actions/upload-artifact,
  # azure/login, dorny/test-reporter, etc). Per GitHub's 2025-09-19 deprecation
  # notice Node 20 is forced off by default on 2026-06-16 and removed from the
  # runner on 2026-09-16. Setting this env var silences the deprecation warnings
  # and exercises Node 24 ahead of the cut-over. To temporarily opt back out,
  # set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # v0.9.1 - OPTIONAL subscription exclusion list. Create a repository (or org)
  # Actions variable named AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH whose value is the
  # repo-relative path to your exclusion CSV (e.g. ./config/Excluded-Subscription-Ids.csv).
  # When set, every AzLocal.UpdateManagement Azure Resource Graph query in this
  # workflow excludes the listed subscriptions. Leave it unset to exclude nothing.
  AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH: ${{ vars.AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH }}

jobs:
  monitor:
    name: Monitor in-flight update runs
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-monitor
    runs-on: windows-latest
    # END-AZLOCAL-CUSTOMIZE:runner-target-monitor
    permissions:
      id-token: write
      contents: read
      checks: write
    outputs:
      # v0.8.5 thin-YAML: keys align byte-for-byte with the lowercase output
      # names emitted by Export-AzLocalUpdateRunMonitorReport (which uses
      # Set-AzLocalPipelineOutput under the hood). ADO is case-sensitive on
      # task.setvariable lookups; GH is case-insensitive but the lowercase
      # form is the canonical one used by every v0.8.5+ Step.* cmdlet.
      in_flight: ${{ steps.snapshot.outputs.in_flight }}
      long_running: ${{ steps.snapshot.outputs.long_running }}
      long_running_step: ${{ steps.snapshot.outputs.long_running_step }}
      step_errored: ${{ steps.snapshot.outputs.step_errored }}
      recent_failures: ${{ steps.snapshot.outputs.recent_failures }}
      unresolved_failures: ${{ steps.snapshot.outputs.unresolved_failures }}
      # v0.8.83: expose the Step.08 UpdateLastAttempt-reconciliation count
      # (clusters whose UpdateLastAttempt tag points at an attempt with no
      # observable updateRun resource - typically a URP package-internal
      # pre-install health-check failure). Wired so downstream pipeline
      # jobs can gate on attempts_without_run > 0.
      attempts_without_run: ${{ steps.snapshot.outputs.attempts_without_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure CLI Login (OIDC)
        id: azure_login
        # v0.9.1: OIDC token exchange / `az login` can transiently fail
        # ("JSON is invalid: Expecting value" / az exit code 1). Let this first
        # attempt fail soft so the retry step below can try once more before the
        # job fails.
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # AZURE_SUBSCRIPTION_ID is a repository *Variable* (vars.*), not a Secret. It
          # is consumed ONLY here: azure/login@v3 runs `az account set --subscription
          # <id>` after the OIDC token exchange so the runner has a default
          # `az account` context. It is NOT used to scope Azure Resource Graph queries
          # (those run fleet-wide across every subscription the federated identity can
          # read) and is NOT interpolated into Azure portal deep-link URLs (those use
          # the per-row `subscriptionId` returned by ARG).
          # Set it via: gh variable set AZURE_SUBSCRIPTION_ID --body <subId>
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # v0.9.1: single automatic retry for the transient login failure above. Runs
      # only when the first attempt failed; no continue-on-error here, so a second
      # failure stops the job.
      - name: Azure CLI Login (OIDC) - retry
        if: steps.azure_login.outcome == 'failure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI Resource Graph Extension
        shell: pwsh
        run: az extension add --name resource-graph --yes

      - name: Install AzLocal.UpdateManagement from PSGallery
        # v0.8.5 thin-YAML: drift detection + banner + step outputs are all
        # produced by Add-AzLocalPipelineVersionBanner (Public cmdlet).
        shell: pwsh
        id: module-version
        run: |
          $ErrorActionPreference = 'Stop'
          $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
          if ($env:REQUIRED_MODULE_VERSION) {
              $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
              Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
          } else {
              Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
          }
          Install-Module @installArgs
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalPipelineVersionBanner `
              -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
              -PinnedVersion $env:REQUIRED_MODULE_VERSION

      - name: Startup delay (event-driven trigger only)
        # Only the Update: 3 (Apply Updates) -> Update: 4 (Monitor) event-driven
        # trigger honours a startup delay, so the monitor lands AFTER updates
        # have had a chance to move past the initial health-check phase. Cron and
        # manual runs NEVER delay (this step is skipped unless
        # triggered_by=apply-updates). The delay value is read from the optional
        # repository Variable MONITOR_TRIGGER_DELAY_MINUTES (set via:
        # gh variable set MONITOR_TRIGGER_DELAY_MINUTES --body 30). Unset/0 = no
        # delay; otherwise clamped to 15..240 minutes (guards a typo from holding
        # the runner for hours / blowing the 6h GitHub-hosted job cap). The sleep
        # lives HERE (in the monitor), never in Apply, because only one Apply run
        # executes at a time - delaying there would block the next Apply attempt.
        if: ${{ github.event.inputs.triggered_by == 'apply-updates' }}
        shell: pwsh
        env:
          MONITOR_TRIGGER_DELAY_MINUTES: ${{ vars.MONITOR_TRIGGER_DELAY_MINUTES || '0' }}
          APPLY_RUN_ID: ${{ github.event.inputs.apply_run_id }}
        run: |
          [int]$delay = 0
          if (-not [int]::TryParse([string]$env:MONITOR_TRIGGER_DELAY_MINUTES, [ref]$delay)) { $delay = 0 }
          if ($delay -le 0) {
              Write-Host 'MONITOR_TRIGGER_DELAY_MINUTES not set (or 0) - no startup delay.'
              return
          }
          if ($delay -lt 15)  { Write-Host "Delay $delay below minimum - clamping to 15.";  $delay = 15 }
          if ($delay -gt 240) { Write-Host "Delay $delay above maximum - clamping to 240."; $delay = 240 }
          Write-Host "Event-driven trigger (apply_run_id=$($env:APPLY_RUN_ID)): sleeping $delay minute(s) before snapshot."
          Start-Sleep -Seconds ($delay * 60)

      - name: Snapshot in-flight update runs
        # v0.8.5 thin-YAML: the inline run block (cluster scope query
        # via Get-AzLocalUpdateRuns -Latest -PassThru, severity
        # classification, per-cluster CSV, JUnit XML, the six step
        # outputs, and the markdown step summary with status badge +
        # in-flight + unresolved-failed tables) has been condensed into
        # the Public cmdlet Export-AzLocalUpdateRunMonitorReport. The
        # cmdlet writes ./reports/update-monitor.csv + .xml, emits the
        # markdown summary via GITHUB_STEP_SUMMARY, and sets the six
        # step outputs (in_flight, long_running, long_running_step,
        # step_errored, recent_failures, unresolved_failures).
        id: snapshot
        shell: pwsh
        env:
          INPUT_SCOPE: ${{ github.event.inputs.scope }}
          INPUT_UPDATE_RING: ${{ github.event.inputs.update_ring }}
          INPUT_THRESHOLD_HOURS: ${{ github.event.inputs.long_running_threshold_hours }}
          INPUT_STEP_THRESHOLD_HOURS: ${{ github.event.inputs.long_running_step_hours }}
          INPUT_RECENT_FAILURE_WINDOW_HOURS: ${{ github.event.inputs.recent_failure_window_hours }}
          INPUT_CRITICAL_ELAPSED_DAYS: ${{ github.event.inputs.critical_elapsed_days }}
          INPUT_SKIP_WHEN_IDLE: ${{ github.event.inputs.skip_when_idle }}
          INSTALLED_MODULE_VERSION: ${{ steps.module-version.outputs.installed_module_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          $params = @{
              Scope                  = if ($env:INPUT_SCOPE) { $env:INPUT_SCOPE } else { 'all' }
              OutputDirectory        = './reports'
              InstalledModuleVersion = $env:INSTALLED_MODULE_VERSION
          }
          if ($env:INPUT_UPDATE_RING) { $params['UpdateRing'] = $env:INPUT_UPDATE_RING }
          [int]$parsed = 0
          if ([int]::TryParse([string]$env:INPUT_STEP_THRESHOLD_HOURS, [ref]$parsed) -and $parsed -gt 0)        { $params['LongRunningStepHours']      = $parsed }
          if ([int]::TryParse([string]$env:INPUT_THRESHOLD_HOURS, [ref]$parsed) -and $parsed -gt 0)             { $params['LongRunningThresholdHours'] = $parsed }
          if ([int]::TryParse([string]$env:INPUT_RECENT_FAILURE_WINDOW_HOURS, [ref]$parsed) -and $parsed -ge 0) { $params['RecentFailureWindowHours']  = $parsed }
          if ([int]::TryParse([string]$env:INPUT_CRITICAL_ELAPSED_DAYS, [ref]$parsed) -and $parsed -gt 0)       { $params['CriticalElapsedDays']       = $parsed }
          # v0.8.90: -SkipWhenIdle defaults ON (cheap idle probe). Scheduled runs
          # have no workflow_dispatch inputs, so an empty value also means ON.
          # Only an explicit 'false' disables it (manual full-sweep override).
          if ($env:INPUT_SKIP_WHEN_IDLE -ne 'false') { $params['SkipWhenIdle'] = $true }
          Export-AzLocalUpdateRunMonitorReport @params

      # v0.8.95: discoverability notice for the opt-in one-time auto-retry of
      # FAILED updates. Shown only when FAILED_UPDATES_SINGLE_RETRY is NOT
      # enabled, so operators who see failed/stalled runs here learn the
      # capability exists (with the enable command + CI/CD README pointer). The
      # monitor never performs retries itself; this is purely informational.
      - name: Failed-update retry availability notice
        if: ${{ always() && vars.FAILED_UPDATES_SINGLE_RETRY != 'true' }}
        shell: pwsh
        run: |
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalFailedUpdateRetryHintSummary

      - name: Compute Artifact Timestamp
        if: always()
        id: artifact-stamp
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
          "timestamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Artifact timestamp: $stamp"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: azlocal-update-monitor_${{ steps.artifact-stamp.outputs.timestamp }}
          path: ./reports/*
          retention-days: 14

      - name: Publish Update Monitor JUnit
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: 'In-Flight Update Monitor'
          path: ./reports/update-monitor.xml
          reporter: java-junit
          list-suites: failed
          list-tests: failed
        continue-on-error: true

      # ----------------------------------------------------------------------
      # ITSM Connector (ServiceNow auto-raise on in-flight monitor failures)
      #
      # Fully opt-in (gated on inputs.raise_itsm_ticket == 'true'). Runs AFTER
      # the JUnit file is uploaded + published, so the ITSM action is strictly
      # additive - failures here never affect the monitor exit code (which is
      # always green; this is a report-only pipeline).
      #
      # Reads the same update-monitor.xml that powers the run summary. The
      # JUnit emitter writes per-testcase <properties> (ClusterName /
      # ClusterResourceId / UpdateName / Status / CurrentStep /
      # ClusterPortalUrl / UpdateRunPortalUrl) so New-AzLocalIncident can
      # compute the SHA256 dedupe key (one incident per stuck/failed/attempt-gap
      # cluster until it clears) and the Mustache body template can deep-link
      # into the Azure portal. Configure which monitor Status values raise a
      # ticket in ./.itsm/azurelocal-itsm.yml (defaults raise AttemptWithoutRun /
      # StepError / Failed; LongRunningStep / LongRunningOverall are opt-in).
      # ----------------------------------------------------------------------
      - name: Install powershell-yaml (ITSM config parser)
        if: ${{ github.event.inputs.raise_itsm_ticket == 'true' }}
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
              Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          }

      - name: Raise ITSM tickets
        if: ${{ github.event.inputs.raise_itsm_ticket == 'true' }}
        shell: pwsh
        id: itsm
        env:
          # BEGIN-AZLOCAL-CUSTOMIZE:itsm-secrets
          # Bind your ITSM connector secrets here. Defaults match the
          # ServiceNow OAuth client_credentials naming used by azurelocal-itsm.yml.
          # Preserved by Update-AzLocalPipelineExample across module upgrades.
          ITSM_SN_INSTANCE_URL: ${{ secrets.ITSM_SN_INSTANCE_URL }}
          ITSM_SN_CLIENT_ID:    ${{ secrets.ITSM_SN_CLIENT_ID }}
          ITSM_SN_CLIENT_SECRET: ${{ secrets.ITSM_SN_CLIENT_SECRET }}
          # END-AZLOCAL-CUSTOMIZE:itsm-secrets
          INPUT_ITSM_CONFIG_PATH:  ${{ github.event.inputs.itsm_config_path }}
          INPUT_ITSM_DRY_RUN:      ${{ github.event.inputs.itsm_dry_run }}
          INPUT_ITSM_FORCE_CREATE: ${{ github.event.inputs.itsm_force_create }}
        run: |
          Import-Module AzLocal.UpdateManagement -Force

          $configPath = $env:INPUT_ITSM_CONFIG_PATH
          $dryRun     = $env:INPUT_ITSM_DRY_RUN -eq 'true'
          $force      = $env:INPUT_ITSM_FORCE_CREATE -eq 'true'

          if (-not (Test-Path $configPath)) {
              Write-Host "::warning::ITSM config not found at '$configPath' - skipping ticket creation."
              exit 0
          }

          $cfg = Get-AzLocalItsmConfig -Path $configPath

          $junitInput = './reports/update-monitor.xml'
          if (-not (Test-Path $junitInput)) {
              Write-Host "::warning::No update-monitor.xml found at '$junitInput' - skipping ticket creation."
              exit 0
          }

          $params = @{
              InputArtifactPath = $junitInput
              Config            = $cfg
              RunMetadata       = @{
                  Platform = 'github'
                  RunId    = $env:GITHUB_RUN_ID
                  RunUrl   = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                  Branch   = $env:GITHUB_REF
              }
              DryRun            = $dryRun
              ForceCreate       = $force
              ExportPath        = './reports/itsm-results.csv'
              ExportJUnitPath   = './reports/itsm-results.xml'
          }

          $results = New-AzLocalIncident @params
          $results | Format-Table ClusterName, Action, TicketId, Severity -AutoSize

      - name: Upload ITSM Artefacts
        if: ${{ github.event.inputs.raise_itsm_ticket == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: azlocal-update-monitor-itsm-results_${{ steps.artifact-stamp.outputs.timestamp }}
          path: ./reports/itsm-*.*
          retention-days: 30
        continue-on-error: true

      - name: Publish ITSM Test Results
        if: ${{ github.event.inputs.raise_itsm_ticket == 'true' }}
        uses: dorny/test-reporter@v3
        with:
          name: 'ITSM Tickets (Update: 4 Monitor)'
          path: ./reports/itsm-results.xml
          reporter: java-junit
        continue-on-error: true
