# Monitor In-Flight Updates (operational monitoring snapshot)
# -----------------------------------------------------------
# Reports clusters whose latest update run is currently in flight, with the
# CURRENT STEP each cluster is on and the ELAPSED DURATION of the run. Built
# for operators who want a 30-minute-cadence "what is happening right now"
# view, distinct from the daily Step.8 fleet-update-status snapshot which
# answers "is each cluster up-to-date?".
#
# This workflow is REPORT-ONLY and always succeeds. Long-running runs are
# surfaced via:
#   - The markdown step summary (sorted by elapsed duration descending, with
#     a Threshold column flagging runs that have exceeded the configured
#     long-running threshold).
#   - update-monitor.csv (full per-cluster rows for spreadsheet triage).
#   - update-monitor.xml (JUnit, one <testcase time="0"> per in-flight cluster;
#     <failure> when the elapsed duration exceeds the threshold so the
#     Checks tab shows stuck runs in red).
#
# Data source: Get-AzLocalUpdateRuns -Latest (one row per cluster). No new
# cmdlets required - this is a pure pipeline composition.

# Workflow name carries the same Step.N - prefix as the filename so the GitHub
# Actions sidebar (which sorts workflows alphabetically by this `name:` field)
# lists the pipelines in execution order.
name: Step.7 - Monitor In-Flight Updates

on:
  # BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
  # Content between BEGIN/END markers is preserved by
  # Update-AzLocalPipelineExample across module upgrades.
  #
  # Default (v0.7.92+): runs 5x/day, every 2 hours across the typical overnight
  # maintenance window (20:00, 22:00, 00:00, 02:00, 04:00 UTC). GitHub Actions
  # cron is ALWAYS UTC - adjust the hour list below for your local maintenance
  # window. Comment the `schedule:` block out entirely to disable.
  #
  # Other typical patterns:
  #   '*/30 * * * *'         every 30 min, 24x7 (busiest)
  #   '0 */2 * * *'          every 2 hours, 24x7
  #   '*/30 * * * 0,6'       every 30 min, weekends only
  #   '*/15 22-6 * * 0,6'    every 15 min during the weekend maintenance window
  schedule:
    - cron: '0 0,2,4,20,22 * * *'
  # END-AZLOCAL-CUSTOMIZE:schedule-triggers

  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope of clusters to monitor'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'by-update-ring'
      update_ring:
        # accepts a single ring (Wave1), a semicolon-delimited list (Prod;Ring2),
        # or '***' (three stars - deliberate, not a typo) to match every cluster that HAS the UpdateRing tag set.
        description: "UpdateRing tag value (only used when scope=by-update-ring). Single ring, 'Prod;Ring2', or '***'."
        required: false
        default: 'Wave1'
      long_running_threshold_hours:
        description: 'Flag in-flight runs whose elapsed duration exceeds this many hours (default 6).'
        required: false
        default: '6'
      module_version:
        description: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
        required: false
        default: ''

env:
  # Module version this workflow YAML was generated against. The install step compares
  # this to the version actually installed and to the latest on PSGallery, and emits a
  # ::notice annotation if the YAML appears stale - prompting you to refresh via
  # Copy-AzLocalPipelineExample -Update. See Automation-Pipeline-Examples/README.md section 5.
  GENERATED_AGAINST_MODULE_VERSION: '0.7.94'
  # Resolution order for the module version pin (leave all unset to install the latest,
  # which is the default "fix-forward" behaviour): manual workflow_dispatch input >
  # repository variable 'REQUIRED_MODULE_VERSION' > empty (latest).
  REQUIRED_MODULE_VERSION: ${{ github.event.inputs.module_version || vars.REQUIRED_MODULE_VERSION || '' }}

jobs:
  monitor:
    name: Monitor in-flight update runs
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      checks: write
    outputs:
      in_flight: ${{ steps.snapshot.outputs.IN_FLIGHT }}
      long_running: ${{ steps.snapshot.outputs.LONG_RUNNING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # AZURE_SUBSCRIPTION_ID is a repository *Variable* (vars.*), not a Secret. It
          # is consumed ONLY here: azure/login@v3 runs `az account set --subscription
          # <id>` after the OIDC token exchange so the runner has a default
          # `az account` context. It is NOT used to scope Azure Resource Graph queries
          # (those run fleet-wide across every subscription the federated identity can
          # read) and is NOT interpolated into Azure portal deep-link URLs (those use
          # the per-row `subscriptionId` returned by ARG).
          # Set it via: gh variable set AZURE_SUBSCRIPTION_ID --body <subId>
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI Resource Graph Extension
        shell: pwsh
        run: az extension add --name resource-graph --yes

      - name: Install AzLocal.UpdateManagement from PSGallery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
          if ($env:REQUIRED_MODULE_VERSION) {
              $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
              Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
          } else {
              Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
          }
          Install-Module @installArgs
          Import-Module AzLocal.UpdateManagement -Force
          $installed = (Get-Module AzLocal.UpdateManagement | Sort-Object Version -Descending | Select-Object -First 1).Version
          $generated = [version]$env:GENERATED_AGAINST_MODULE_VERSION
          $latest    = (Find-Module -Name AzLocal.UpdateManagement -Repository PSGallery -ErrorAction SilentlyContinue).Version
          Write-Host ""
          Write-Host "Module version summary"
          Write-Host "  Installed on runner       : $installed"
          Write-Host "  YAML generated against    : $generated"
          Write-Host "  Latest on PSGallery       : $(if ($latest) { $latest } else { '(lookup failed - check network)' })"
          Write-Host ""
          Get-Module AzLocal.UpdateManagement | Format-List Name, Version, Path
          if ($installed -lt $generated) {
              $msg = "AzLocal.UpdateManagement v$installed is OLDER than the version this workflow YAML was generated against (v$generated). Cmdlets, parameters, or output schemas referenced by this YAML may not exist in v$installed. Set REQUIRED_MODULE_VERSION to v$generated, or refresh the YAML to match the installed module via 'Copy-AzLocalPipelineExample -Destination .\.github\workflows -Platform GitHub -Update'."
              Write-Host "::warning title=AzLocal.UpdateManagement is older than workflow YAML expects::$msg"
          }
          if ($installed -gt $generated) {
              $msg = "Workflow YAML was generated against AzLocal.UpdateManagement v$generated but the runner installed v$installed. Pipeline steps may have been improved in later releases - to refresh, re-run 'Copy-AzLocalPipelineExample -Destination .\.github\workflows -Platform GitHub -Update' (you will be prompted per file; add -Confirm:`$false to bypass). Pipeline YAMLs are under git so 'git diff' shows exactly what changed before commit."
              Write-Host "::notice title=Workflow YAML may be stale::$msg"
          }
          if ($latest -and ($latest -gt $installed)) {
              $msg = "AzLocal.UpdateManagement v$latest is available on PSGallery; this run installed v$installed. Review the module CHANGELOG before bumping REQUIRED_MODULE_VERSION (or clear the pin to install the latest automatically)."
              Write-Host "::notice title=Newer AzLocal.UpdateManagement version available on PSGallery::$msg"
          }

      - name: Snapshot in-flight update runs
        id: snapshot
        shell: pwsh
        env:
          INPUT_SCOPE: ${{ github.event.inputs.scope }}
          INPUT_UPDATE_RING: ${{ github.event.inputs.update_ring }}
          INPUT_THRESHOLD_HOURS: ${{ github.event.inputs.long_running_threshold_hours }}
        run: |
          Import-Module AzLocal.UpdateManagement -Force

          $scope = if ($env:INPUT_SCOPE) { $env:INPUT_SCOPE } else { 'all' }
          $updateRing = $env:INPUT_UPDATE_RING

          # Threshold parse with safe default
          $thresholdHours = 6
          if ($env:INPUT_THRESHOLD_HOURS) {
              [int]$parsed = 0
              if ([int]::TryParse($env:INPUT_THRESHOLD_HOURS, [ref]$parsed) -and $parsed -gt 0) { $thresholdHours = $parsed }
          }
          $thresholdSpan = [TimeSpan]::FromHours($thresholdHours)
          Write-Host "Long-running threshold: $thresholdHours hour(s)"

          $outputDir = './reports'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $monitorCsv = Join-Path $outputDir 'update-monitor.csv'
          $monitorXml = Join-Path $outputDir 'update-monitor.xml'

          # Build cluster scope. -Latest returns one row per cluster.
          # -PassThru is REQUIRED: without it Get-AzLocalUpdateRuns only writes formatted output to
          # the host and returns nothing to the pipeline, silently producing an empty $runs and a
          # 0/0/0 monitor snapshot even when there are in-flight runs. -SkipSideloadedReset is set
          # because this is a read-only observability pipeline and must not mutate cluster tags.
          $runs = @()
          if ($scope -eq 'by-update-ring' -and $updateRing) {
              Write-Host "Scope: UpdateRing = $updateRing"
              $runs = @(Get-AzLocalUpdateRuns -ScopeByUpdateRingTag -UpdateRingValue $updateRing -Latest -PassThru -SkipSideloadedReset)
          } else {
              Write-Host "Scope: all clusters (via inventory)"
              $inventory = Get-AzLocalClusterInventory -PassThru
              if (-not $inventory -or $inventory.Count -eq 0) {
                  Write-Warning 'No clusters found in inventory.'
                  "IN_FLIGHT=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  "LONG_RUNNING=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                  # Emit an empty CSV so the artifact upload step has something to attach.
                  '' | Set-Content -Path $monitorCsv -Encoding utf8
                  exit 0
              }
              $resourceIds = @($inventory | Select-Object -ExpandProperty ResourceId)
              $runs = @(Get-AzLocalUpdateRuns -ClusterResourceIds $resourceIds -Latest -PassThru -SkipSideloadedReset)
          }

          # Project + enrich. Parse StartTime ("yyyy-MM-dd HH:mm" from Format-AzLocalUpdateRun)
          # back to [datetime] to compute live elapsed for threshold comparison.
          $now = (Get-Date).ToUniversalTime()
          $rows = foreach ($r in $runs) {
              $startDt = $null
              if ($r.StartTime) {
                  [datetime]$tmp = [datetime]::MinValue
                  if ([datetime]::TryParse([string]$r.StartTime, [ref]$tmp)) {
                      # StartTime as formatted by Format-AzLocalUpdateRun is UTC (ARM authoritative).
                      $startDt = [datetime]::SpecifyKind($tmp, [DateTimeKind]::Utc)
                  }
              }
              $elapsed = if ($startDt) { $now - $startDt } else { $null }
              $elapsedDisplay = if ($elapsed) {
                  if ($elapsed.TotalDays -ge 1) { ('{0}d {1}h {2}m' -f [int]$elapsed.TotalDays, $elapsed.Hours, $elapsed.Minutes) }
                  elseif ($elapsed.TotalHours -ge 1) { ('{0}h {1}m' -f [int]$elapsed.TotalHours, $elapsed.Minutes) }
                  else { ('{0}m' -f [int]$elapsed.TotalMinutes) }
              } else { '' }
              $exceeds = if ($elapsed -and ($r.State -eq 'InProgress')) { $elapsed -gt $thresholdSpan } else { $false }
              [PSCustomObject]@{
                  ClusterName     = $r.ClusterName
                  UpdateName      = $r.UpdateName
                  State           = $r.State
                  CurrentStep     = $r.CurrentStep
                  Progress        = $r.Progress
                  StartTimeUtc    = if ($startDt) { $startDt.ToString('yyyy-MM-dd HH:mm') } else { '' }
                  ElapsedDisplay  = $elapsedDisplay
                  ElapsedHours    = if ($elapsed) { [math]::Round($elapsed.TotalHours, 2) } else { '' }
                  ExceedsThreshold = $exceeds
                  ThresholdHours  = $thresholdHours
                  RunId           = $r.RunId
                  Duration        = $r.Duration
                  CurrentStepDetail = $r.CurrentStepDetail
              }
          }

          $inFlight = @($rows | Where-Object { $_.State -eq 'InProgress' })
          $longRunning = @($inFlight | Where-Object { $_.ExceedsThreshold })

          # CSV (always emit, even if empty, so the artifact step has a file)
          if ($rows -and $rows.Count -gt 0) {
              $rows | Sort-Object @{Expression='ExceedsThreshold';Descending=$true}, @{Expression='ElapsedHours';Descending=$true}, ClusterName | Export-Csv -Path $monitorCsv -NoTypeInformation -Encoding utf8
          } else {
              '' | Set-Content -Path $monitorCsv -Encoding utf8
          }

          # JUnit XML - one <testcase time="0"> per in-flight cluster; <failure> when threshold exceeded.
          # If nothing is in flight we still emit a zero-test suite so the publish step works.
          $xmlLines = New-Object 'System.Collections.Generic.List[string]'
          $xmlLines.Add('<?xml version="1.0" encoding="UTF-8"?>')
          $xmlLines.Add('<testsuites time="0">')
          $tests = $inFlight.Count
          $failures = $longRunning.Count
          $xmlLines.Add(('  <testsuite name="In-Flight Update Runs" tests="{0}" failures="{1}" time="0">' -f $tests, $failures))
          foreach ($r in ($inFlight | Sort-Object @{Expression='ElapsedHours';Descending=$true})) {
              $safeName = ($r.ClusterName -replace '[^A-Za-z0-9_.-]', '_')
              $caseName = "$safeName - $($r.UpdateName) - $($r.CurrentStep)"
              $caseNameXml = [System.Security.SecurityElement]::Escape($caseName)
              if ($r.ExceedsThreshold) {
                  $msg = ('Elapsed {0} exceeds threshold of {1}h. CurrentStep: {2}. Progress: {3}.' -f $r.ElapsedDisplay, $r.ThresholdHours, $r.CurrentStep, $r.Progress)
                  $msgXml = [System.Security.SecurityElement]::Escape($msg)
                  $xmlLines.Add(('    <testcase name="{0}" classname="UpdateMonitor" time="0">' -f $caseNameXml))
                  $xmlLines.Add(('      <failure message="{0}" type="LongRunning">{0}</failure>' -f $msgXml))
                  $xmlLines.Add('    </testcase>')
              } else {
                  $xmlLines.Add(('    <testcase name="{0}" classname="UpdateMonitor" time="0"/>' -f $caseNameXml))
              }
          }
          $xmlLines.Add('  </testsuite>')
          $xmlLines.Add('</testsuites>')
          ($xmlLines -join [Environment]::NewLine) | Set-Content -Path $monitorXml -Encoding utf8

          # Job outputs
          "IN_FLIGHT=$($inFlight.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "LONG_RUNNING=$($longRunning.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Markdown step summary
          $md = New-Object 'System.Collections.Generic.List[string]'
          $md.Add('## In-Flight Update Monitor')
          $md.Add('')
          $scopeLabel = if ($scope -eq 'by-update-ring' -and $updateRing) { "by-update-ring (UpdateRing = $updateRing)" } else { 'all clusters' }
          $md.Add("**Scope**: $scopeLabel - **Threshold**: ${thresholdHours}h - **Snapshot (UTC)**: $($now.ToString('yyyy-MM-dd HH:mm'))")
          $md.Add('')
          $md.Add('| Metric | Count |')
          $md.Add('|--------|-------|')
          $md.Add("| Clusters scoped | $($rows.Count) |")
          $md.Add("| Update runs in flight | $($inFlight.Count) |")
          $md.Add("| Exceeding ${thresholdHours}h threshold | $($longRunning.Count) |")
          $md.Add('')
          if ($inFlight.Count -gt 0) {
              $md.Add('### In-flight runs (sorted by elapsed, longest first)')
              $md.Add('')
              $md.Add('| Cluster | Update | State | Current Step | Progress | Started (UTC) | Elapsed | Threshold |')
              $md.Add('|---------|--------|-------|--------------|----------|---------------|---------|-----------|')
              foreach ($r in ($inFlight | Sort-Object @{Expression='ElapsedHours';Descending=$true})) {
                  $cs = if ($r.CurrentStep) { $r.CurrentStep } else { '-' }
                  $pg = if ($r.Progress) { $r.Progress } else { '-' }
                  $flag = if ($r.ExceedsThreshold) { ":warning: >${thresholdHours}h" } else { 'within' }
                  $md.Add("| $($r.ClusterName) | $($r.UpdateName) | $($r.State) | $cs | $pg | $($r.StartTimeUtc) | $($r.ElapsedDisplay) | $flag |")
              }
              $md.Add('')
              if ($longRunning.Count -gt 0) {
                  $md.Add("> **Action**: $($longRunning.Count) in-flight run(s) exceed the ${thresholdHours}h threshold. Investigate the Current Step shown above; consult the Azure Local Update Manager portal for the affected cluster(s) and the underlying activity log. The Checks tab shows the same long-running rows as JUnit failures.")
              } else {
                  $md.Add("> **All in-flight runs are within the ${thresholdHours}h threshold.**")
              }
          } else {
              $md.Add('### No update runs currently in flight')
              $md.Add('')
              $md.Add("No clusters in scope have a latest run in state ``InProgress``. To verify scope, see the artifact CSV (``update-monitor.csv``).")
          }
          $md.Add('')
          $md.Add('_Source data: `Get-AzLocalUpdateRuns -Latest`. JUnit emitted as `./reports/update-monitor.xml`; full per-cluster rows in `./reports/update-monitor.csv`._')
          ($md -join [Environment]::NewLine) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compute Artifact Timestamp
        if: always()
        id: artifact-stamp
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
          "timestamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Artifact timestamp: $stamp"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: azlocal-update-monitor_${{ steps.artifact-stamp.outputs.timestamp }}
          path: ./reports/*
          retention-days: 14

      - name: Publish Update Monitor JUnit
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: 'In-Flight Update Monitor'
          path: ./reports/update-monitor.xml
          reporter: java-junit
          list-suites: failed
          list-tests: failed
        continue-on-error: true
