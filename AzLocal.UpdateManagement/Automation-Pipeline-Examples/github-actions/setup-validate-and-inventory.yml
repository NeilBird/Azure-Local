# AZLOCAL-PIPELINE-ID: setup-validate-and-inventory
# Config: 1 - Validate Auth and Inventory Azure Local Clusters
#
# PURPOSE:
#   This is the first step in the setup workflow. It combines two operations:
#   1. VALIDATION: Validates OIDC + RBAC + subscription scope access
#   2. INVENTORY: Queries all Azure Local clusters and exports inventory with UpdateRing tag status
#
#   Run this workflow:
#       - BEFORE adding the operational workflows (Update: 1-4 and Monitor: 1-3). It narrows any failure 
#         to authentication/discovery rather than seven interacting pipelines.
#       - PERIODICALLY (recommended monthly, or after every RBAC change in the tenant) 
#         to confirm subscription scope and cluster inventory are accurate.
#
# VALIDATION PROBES:
#       1. azure/login OIDC token exchange (App Registration + federated credential).
#       2. Repository / environment secrets (AZURE_CLIENT_ID, _TENANT_ID, _SUBSCRIPTION_ID).
#       3. Azure RBAC on the App Registration's service principal.
#       4. Resource Graph reachability (proves the SP can actually see clusters).
#       5. Subscription scope: total count and full Subscription ID / Name table.
#
# INVENTORY OUTPUT COLUMNS:
#   ClusterName, ResourceGroup, SubscriptionId, SubscriptionName,
#   UpdateRing, HasUpdateRingTag, UpdateStartWindow, UpdateExclusions,
#   UpdateSideloaded, UpdateVersionInProgress, ResourceId
#
#   - UpdateSideloaded (operator-set): True/False/1/0 - sideloaded-payload gate
#   - UpdateVersionInProgress (module-managed; do not edit): staged update name
#   See main module README, section "Sideloaded Payload Workflow".
#
# REPORTS GENERATED:
#   - Authentication: JUnit XML + subscriptions.json + subscriptions.csv
#   - Inventory: ClusterUpdateRings.csv + ClusterUpdateRings.json + README_Instructions.txt
#   - GITHUB_STEP_SUMMARY markdown: Version banner, subscription count with collapsible
#     details table, cluster inventory summary with UpdateRing distribution, next steps.
#   - Artifacts: Both reports available for download.
#
# HOW TO TRIGGER (after committed to default branch):
#   gh workflow run setup-validate-and-inventory.yml --repo <owner>/<repo>
#   gh workflow run setup-validate-and-inventory.yml --repo <owner>/<repo> -f environment=DevTest
#   gh run watch --repo <owner>/<repo>
#
# See Automation-Pipeline-Examples/README.md for full setup story.

name: 'Config: 1 - Validate Auth and Inventory Clusters'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment (leave blank for branch-scoped OIDC, or specify environment name for environment-scoped OIDC + secrets)'
        required: false
        default: ''
      subscription_filter:
        description: 'Subscription ID to filter inventory (leave empty for all subscriptions)'
        required: false
        default: ''
      module_version:
        description: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5.'
        required: false
        default: ''
      diagnostics:
        description: 'Enable bounded verbose diagnostics for this manual run. Repository variable DEBUG_VERBOSE=true enables diagnostics for all runs, including schedules.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
  # Content between BEGIN/END markers is preserved by
  # Update-AzLocalPipelineExample across module upgrades. Edit the cron
  # below or add more `- cron:` entries to suit your maintenance windows.
  schedule:
    # Run weekly on Sunday at 8:00 AM UTC
    - cron: '17 8 * * 0'
  # END-AZLOCAL-CUSTOMIZE:schedule-triggers

env:
  # Module version this workflow YAML was generated against. The install step compares
  # this to the version actually installed and to the latest on PSGallery, and emits a
  # ::notice annotation if the YAML appears stale - prompting you to refresh via
  # Copy-AzLocalPipelineExample. See Automation-Pipeline-Examples/README.md section 5.
  GENERATED_AGAINST_MODULE_VERSION: '0.9.28'
  # Resolution order for the module version pin (leave all unset to install the latest,
  # which is the default "fix-forward" behaviour): manual workflow_dispatch input >
  # repository variable 'REQUIRED_MODULE_VERSION' > empty (latest).
  REQUIRED_MODULE_VERSION: ${{ github.event.inputs.module_version || vars.REQUIRED_MODULE_VERSION || '' }}
  # v0.8.4 - opt this workflow into Node.js 24 for all JavaScript actions
  # (actions/checkout, actions/download-artifact, actions/upload-artifact,
  # azure/login, dorny/test-reporter, etc). Per GitHub's 2025-09-19 deprecation
  # notice Node 20 is forced off by default on 2026-06-16 and removed from the
  # runner on 2026-09-16. Setting this env var silences the deprecation warnings
  # and exercises Node 24 ahead of the cut-over. To temporarily opt back out,
  # set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # v0.9.1 - OPTIONAL subscription exclusion list. Create a repository (or org)
  # Actions variable named AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH whose value is the
  # repo-relative path to your exclusion CSV (e.g. ./config/Excluded-Subscription-Ids.csv).
  # When set, every AzLocal.UpdateManagement Azure Resource Graph query in this
  # workflow excludes the listed subscriptions. Leave it unset to exclude nothing.
  AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH: ${{ vars.AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH }}
  DEBUG_VERBOSE: ${{ vars.DEBUG_VERBOSE == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.diagnostics == 'true') && 'true' || 'false' }}

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  validate:
    name: 'Validate OIDC + RBAC + Subscription Scope'
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-validate
    runs-on: windows-latest
    # END-AZLOCAL-CUSTOMIZE:runner-target-validate
    timeout-minutes: ${{ fromJSON(vars.AZLOCAL_MAX_PIPELINE_RUNTIME_MINUTES || '120') }}
    environment: ${{ inputs.environment }}

    outputs:
      subscription_count: ${{ steps.report.outputs.subscription_count }}
      cluster_count: ${{ steps.report.outputs.cluster_count }}
      auth_valid: ${{ steps.report.outputs.auth_valid }}

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5

      - name: 'Azure login (OIDC)'
        id: azure_login
        # v0.9.1: OIDC token exchange / `az login` can transiently fail
        # ("JSON is invalid: Expecting value" / az exit code 1). Let this first
        # attempt fail soft so the retry step below can try once more before the
        # job fails.
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # v0.9.1: single automatic retry for the transient login failure above. Runs
      # only when the first attempt failed.
      # v0.9.12: this retry is now ALSO soft (continue-on-error) so the auth
      # validation report below always runs and publishes its diagnostics; the
      # final "Verify Azure subscription access" gate then fails the job with a
      # clear, run-summary-visible message when zero subscriptions are visible.
      - name: 'Azure login (OIDC) - retry'
        id: azure_login_retry
        if: steps.azure_login.outcome == 'failure'
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 'Install AzLocal.UpdateManagement from PSGallery'
        shell: pwsh
        id: module-version
        run: |
          $ErrorActionPreference = 'Stop'
          $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
          if ($env:REQUIRED_MODULE_VERSION) {
              $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
              Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
          } else {
              Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
          }
          # Transient PSGallery lookups can intermittently fail with "No match was found
          # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
          # (a PSGallery search index / publish-propagation blip). Retry the install up
          # to 25 attempts (~25 min) with capped exponential backoff + jitter (10s, 20s, 40s, 60s cap) to ride out a prolonged PSGallery search-index outage in a single run.
          $installMaxAttempts = 25
          $installAttempt = 0
          while ($true) {
              $installAttempt++
              try {
                  Install-Module @installArgs
                  break
              } catch {
                  if ($installAttempt -ge $installMaxAttempts) {
                      Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                      throw
                  }
                  $installRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $installAttempt - 1)) + (Get-Random -Minimum 0 -Maximum 5)
                  Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                  Start-Sleep -Seconds $installRetryDelay
              }
          }
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalPipelineVersionBanner `
              -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
              -PinnedVersion $env:REQUIRED_MODULE_VERSION

      - name: 'Collect Authentication and Subscription Scope Report'
        id: report
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          INSTALLED_MODULE_VERSION:    ${{ steps.module-version.outputs.installed_module_version }}
          GENERATED_AGAINST_VERSION:   ${{ steps.module-version.outputs.generated_against_version }}
          LATEST_ON_PSGALLERY:         ${{ steps.module-version.outputs.latest_on_psgallery }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          if ($env:DEBUG_VERBOSE -eq 'true') {
              $VerbosePreference = 'Continue'
              $PSDefaultParameterValues['*-AzLocal*:Verbose'] = $true
              New-Item -ItemType Directory -Path './diagnostics' -Force | Out-Null
              Start-Transcript -Path './diagnostics/setup-validate-and-inventory.log' -Force
              $module = Get-Module AzLocal.UpdateManagement | Sort-Object Version -Descending | Select-Object -First 1
              Write-Host "Diagnostics enabled (trigger=$env:GITHUB_EVENT_NAME; PowerShell=$($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition); module=$($module.Version); path=$($module.Path))."
          }
          Export-AzLocalAuthValidationReport `
              -AzureClientId          $env:AZURE_CLIENT_ID `
              -ReportDirectory        './reports' `
              -InstalledModuleVersion $env:INSTALLED_MODULE_VERSION `
              -GeneratedAgainstVersion $env:GENERATED_AGAINST_VERSION `
              -LatestOnPSGallery      $env:LATEST_ON_PSGALLERY

      - name: 'Upload verbose diagnostics'
        if: always() && env.DEBUG_VERBOSE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: azlocal-setup-validate-and-inventory-diagnostics_${{ github.run_id }}_${{ github.run_attempt }}
          path: ./diagnostics/*.log
          if-no-files-found: warn
          retention-days: ${{ fromJSON(vars.DEBUG_RETENTION_DAYS || '14') }}

      # v0.9.12: fail with a clear, run-summary-visible message (instead of the
      # downstream publish step's misleading "No test report files were found")
      # when the auth report step reported success but wrote no report files.
      - name: 'Verify diagnostic reports were produced'
        if: steps.report.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          Assert-AzLocalPipelineReport -Path './reports/*.xml' -ProducingStepName 'Collect Authentication and Subscription Scope Report'

      - name: 'Compute Artifact Timestamp'
        id: artifact-stamp
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
          "timestamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Artifact timestamp: $stamp"

      - name: 'Upload auth report artifact'
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: azlocal-setup-auth-report_${{ steps.artifact-stamp.outputs.timestamp }}
          path: ./reports/
          retention-days: 30

      - name: 'Publish JUnit Diagnostic Results'
        # v0.9.12: was `if: always()`; now success()-gated so it skips when an
        # upstream step failed - eliminating the misleading "No test report files
        # were found" cascade.
        if: success()
        uses: dorny/test-reporter@v3
        with:
          name: '[JUnit Debug] Config: 1 - Authentication Validation'
          path: ./reports/auth-report.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: failed
          list-tests: failed

      # v0.9.12: final hard gate for this diagnostic job. Placed AFTER the auth
      # report is collected + published so the operator keeps the full auth
      # diagnostic, then the job fails with a clear remediation summary when the
      # identity can see no Azure subscriptions (the "No subscriptions found for
      # ***" case). Gated on the report step's success so a genuine
      # not-authenticated failure (which the report step throws on) stays the
      # primary error.
      - name: 'Verify Azure subscription access'
        if: steps.report.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          Assert-AzLocalAzureSubscriptionAccess

  inventory-clusters:
    name: 'Inventory Azure Local Clusters'
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-inventory-clusters
    runs-on: windows-latest
    # END-AZLOCAL-CUSTOMIZE:runner-target-inventory-clusters
    timeout-minutes: ${{ fromJSON(vars.AZLOCAL_MAX_PIPELINE_RUNTIME_MINUTES || '120') }}
    needs: validate
    if: success()
    
    outputs:
      cluster_count: ${{ steps.inventory.outputs.cluster_count }}
      with_tag_count: ${{ steps.inventory.outputs.with_tag_count }}
      without_tag_count: ${{ steps.inventory.outputs.without_tag_count }}

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v5
    
    - name: 'Azure CLI Login (OIDC)'
      id: azure_login
      # v0.9.1: OIDC token exchange / `az login` can transiently fail
      # ("JSON is invalid: Expecting value" / az exit code 1). Let this first
      # attempt fail soft so the retry step below can try once more before the
      # job fails.
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    # v0.9.1: single automatic retry for the transient login failure above. Runs
    # only when the first attempt failed.
    # v0.9.12: this retry is now ALSO soft (continue-on-error); the dedicated
    # "Verify Azure subscription access" gate below is this job's single hard
    # authentication/authorization gate and fails with a clear summary message.
    - name: 'Azure CLI Login (OIDC) - retry'
      id: azure_login_retry
      if: steps.azure_login.outcome == 'failure'
      continue-on-error: true
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
    - name: 'Install Azure CLI Resource Graph Extension'
      shell: pwsh
      run: |
        az extension add --name resource-graph --yes
    
    - name: 'Install AzLocal.UpdateManagement from PSGallery'
      shell: pwsh
      id: module-version
      run: |
        $ErrorActionPreference = 'Stop'
        $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
        if ($env:REQUIRED_MODULE_VERSION) {
            $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
            Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
        } else {
            Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
        }
        # Transient PSGallery lookups can intermittently fail with "No match was found
        # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
        # (a PSGallery search index / publish-propagation blip). Retry the install up
        # to 25 attempts (~25 min) with capped exponential backoff + jitter (10s, 20s, 40s, 60s cap) to ride out a prolonged PSGallery search-index outage in a single run.
        $installMaxAttempts = 25
        $installAttempt = 0
        while ($true) {
            $installAttempt++
            try {
                Install-Module @installArgs
                break
            } catch {
                if ($installAttempt -ge $installMaxAttempts) {
                    Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                    throw
                }
                $installRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $installAttempt - 1)) + (Get-Random -Minimum 0 -Maximum 5)
                Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                Start-Sleep -Seconds $installRetryDelay
            }
        }
        Import-Module AzLocal.UpdateManagement -Force
        Add-AzLocalPipelineVersionBanner `
            -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
            -PinnedVersion $env:REQUIRED_MODULE_VERSION

    # v0.9.12: fail EARLY with a run-summary-visible message when the pipeline
    # identity can see no Azure subscriptions. Because both azure/login attempts
    # above are now soft, this is the job's hard authentication/authorization
    # gate (cluster inventory across the fleet needs at least one subscription).
    - name: 'Verify Azure subscription access'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force
        Assert-AzLocalAzureSubscriptionAccess

    - name: 'Run Cluster Inventory'
      id: inventory
      shell: pwsh
      env:
        INPUT_SUBSCRIPTION_FILTER: ${{ github.event.inputs.subscription_filter }}
        INSTALLED_MODULE_VERSION:  ${{ steps.module-version.outputs.installed_module_version }}
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module AzLocal.UpdateManagement -Force
        Invoke-AzLocalClusterInventory `
            -OutputDirectory       './artifacts' `
            -SubscriptionFilter    $env:INPUT_SUBSCRIPTION_FILTER `
            -InstalledModuleVersion $env:INSTALLED_MODULE_VERSION

    - name: 'Compute Artifact Timestamp'
      id: artifact-stamp
      shell: pwsh
      run: |
        $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
        "timestamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Artifact timestamp: $stamp"

    - name: 'Upload Inventory Artifact'
      uses: actions/upload-artifact@v6
      with:
        name: azlocal-setup-cluster-inventory_${{ steps.artifact-stamp.outputs.timestamp }}
        path: |
          ./artifacts/*.csv
          ./artifacts/*.json
          ./artifacts/README_Instructions.txt
        retention-days: 30

    # v0.9.18: render the support disclaimer at the very bottom of the run summary.
    - name: Support disclaimer
      if: always()
      continue-on-error: true
      shell: pwsh
      run: |
        Import-Module AzLocal.UpdateManagement -Force
        Add-AzLocalPipelineSupportFooter
