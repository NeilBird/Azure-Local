# AZLOCAL-PIPELINE-ID: sideload-updates
# Update: 2 - Sideload Updates (Opt-in, on-prem self-hosted agent)
#
# OPT-IN, OFF BY DEFAULT. This pipeline automates the on-prem sideloading of
# Azure Local solution-update media for clusters that cannot pull updates from
# Azure directly. It is the NEW Step.6 introduced in v0.8.7; the former Step.6
# (Apply Updates) is now Step.7.
#
# WHY A SELF-HOSTED AGENT:
#   The agent must sit on the SAME network as the target Azure Local clusters so
#   it can (a) Robocopy the CombinedSolutionBundle to each cluster's
#   infrastructure `import` SMB share and (b) PowerShell-remote (WinRM) into a
#   cluster node to verify the SHA256 and run Add-SolutionUpdate. Microsoft-hosted
#   agents cannot reach the on-prem fabric, so this pipeline targets a self-hosted
#   AGENT in an agent POOL, selected by the `azlocal-sideload` demand.
#
# RE-ENTRANT STATE MACHINE:
#   Each run advances every in-scope cluster by ONE state transition and exits.
#   The multi-hour copy itself runs in a detached Windows Scheduled Task, so no
#   pipeline run is ever long-lived. Drive this on a frequent CRON (e.g. every
#   30 minutes) so the state machine progresses Copying -> Copied -> Verified ->
#   Imported across successive short runs. Re-running is always safe.
#
# GATE: the self-hosted stage runs only when
#   config/sideload-settings.yml has enabled: true.
#
# AUTHENTICATION:
#   - Azure CLI context (ARG fleet read via 'az graph query' + UpdateSideloaded
#     tag flip via 'az rest') is provided by the AzureCLI@2 task's Workload
#     Identity Federation service connection.
#   - Az PowerShell context (Get-AzKeyVaultSecret for the WinRM credential) is
#     established inside the script from the federated token that
#     addSpnToEnvironment exposes. For a secret-based service principal or a
#     self-hosted agent managed identity, replace that Connect-AzAccount line per
#     the identity.keyVaultAuth setting (see inline comments).
#   - Cluster WinRM remoting uses an Active Directory [pscredential] built from
#     two Key Vault secrets named in the sideload auth-map row (NOT the pipeline
#     identity).

# BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
# Edits inside this block are preserved across Update-AzLocalPipelineExample
# module upgrades. Add or modify `schedules:` blocks below.
trigger: none  # Manual or scheduled only

# NO default schedule ships out-of-the-box (this pipeline requires an on-prem
# self-hosted agent that most projects do not have). Once your agent is online in
# a pool that satisfies the `azlocal-sideload` demand, UNCOMMENT the schedule
# below to drive the re-entrant state machine. A frequent poll (every 30 min)
# lets a single short run advance the multi-hour copy without staying alive.
#
# schedules:
#   - cron: '*/30 * * * *'   # every 30 minutes - advance/report sideload state
#     displayName: 'Sideload state machine poll'
#     branches:
#       include:
#         - main
#     always: true
#     batch: true              # never overlap scheduled reconciliation runs
# END-AZLOCAL-CUSTOMIZE:schedule-triggers

parameters:
  - name: updateRing
    # accepts a single ring, 'Prod;Ring2' list, or '***' wildcard (three stars - deliberate).
    displayName: "UpdateRing tag value to scope the plan ('Wave1', 'Prod;Ring2', or '***' for ALL rings)."
    type: string
    default: '***'

  - name: dryRun
    displayName: 'Preview the plan + transitions without staging media, registering tasks, or flipping tags (WhatIf).'
    type: boolean
    default: true

  - name: moduleVersion
    displayName: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
    type: string
    default: ''

  - name: diagnostics
    displayName: 'Enable bounded verbose diagnostics for this manual run. DEBUG_VERBOSE=true enables diagnostics for every run.'
    type: boolean
    default: false

variables:
  # Module version this YAML was generated against (per-file stamp; do NOT move to
  # the shared group). The install step compares this to the installed version and
  # to the latest on PSGallery and warns if the YAML looks stale - prompting a
  # refresh via Copy-AzLocalPipelineExample -Update.
  - name: GENERATED_AGAINST_MODULE_VERSION
    value: '0.9.27'
  # Resolution order for the module version pin: queue-time parameter 'moduleVersion'
  # > empty (latest). Leave empty for the default fix-forward behaviour.
  - name: REQUIRED_MODULE_VERSION
    value: '${{ parameters.moduleVersion }}'
  - name: reportsPath
    value: '$(Build.ArtifactStagingDirectory)/reports'
  # Shared, set-once pipeline settings come from the variable group below - the
  # Azure DevOps equivalent of GitHub repo Variables. Set them ONCE in the group
  # and every pipeline picks up the same values. This pipeline reads:
  #   AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH  (default '') - optional subscription
  #       exclusion CSV path; when non-empty every Azure Resource Graph query
  #       in this pipeline excludes the listed subscriptions.
  # Create the group once (Library > Variable groups, or
  # `az pipelines variable-group create`). See Automation-Pipeline-Examples/README.md
  # section 5. A variable redefined inline would OVERRIDE the group, so these are
  # intentionally not redefined here - the group is the single source of truth.
  - group: AzureLocal-Pipeline-Settings
  - name: AZLOCAL_EFFECTIVE_PIPELINE_RUNTIME_MINUTES
    value: $[coalesce(variables['AZLOCAL_MAX_PIPELINE_RUNTIME_MINUTES'], 120)]

stages:
# ---------------------------------------------------------------------------
# PREFLIGHT (always runs on a Microsoft-hosted Windows agent)
# ---------------------------------------------------------------------------
# Purpose: explain - in the stage step summary - WHY the `Sideload` stage did
# or did not run, so an operator who triggers Step.6 without first completing
# the opt-in setup sees a clear "what to do next" panel instead of a silent
# "Skipped" status (the symptom that prompted v0.8.76).
#
# Cost: ~10s on windows-latest. No Azure / Key Vault access. Always runs.
#
# Outcomes:
#   - Gate OFF (config/sideload-settings.yml has enabled: false):
#       Preflight succeeds with an informational panel showing how to enable
#       Step.6. The `Sideload` stage is then SKIPPED by its own condition.
#   - Gate ON + paths.stateRoot missing: Preflight FAILS with a panel
#       listing the missing variable(s). The `Sideload` stage is skipped
#       because its `dependsOn: Preflight` cannot be satisfied.
#   - All checks pass: Preflight succeeds, `Sideload` proceeds onto your
#       self-hosted pool.
#
# NOTE: Unlike the GitHub Actions equivalent, Azure DevOps does NOT enumerate
# agent availability here. The ADO pool/agent API requires `Agent Pools (read)`
# scope which most pipeline identities do not hold. Verify your `azlocal-sideload`
# capability is present in your self-hosted pool MANUALLY (Project Settings ->
# Agent pools -> <pool> -> Capabilities).
- stage: Preflight
  displayName: 'Step.06 Preflight - Validate Opt-in'
  jobs:
  - job: PreflightCheck
    timeoutInMinutes: $(AZLOCAL_EFFECTIVE_PIPELINE_RUNTIME_MINUTES)
    displayName: 'Validate Sideload Opt-in + Required Configuration'
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-PreflightCheck
    pool:
      vmImage: windows-latest
    # END-AZLOCAL-CUSTOMIZE:runner-target-PreflightCheck
    steps:
    - checkout: self
      displayName: 'Checkout repository'

    - task: PowerShell@2
      displayName: 'Run Step.6 preflight'
      name: preflight
      env:
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $summaryPath = Join-Path $env:AGENT_TEMPDIRECTORY 'sideload-preflight.md'
          $lines = [System.Collections.Generic.List[string]]::new()
          function Append-Summary([string]$line) { [void]$lines.Add($line) }

            Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
            Import-Module powershell-yaml -Force
            $settingsPath = './config/sideload-settings.yml'
            if (-not (Test-Path -LiteralPath $settingsPath -PathType Leaf)) {
              throw "Required sideload settings file not found: $settingsPath. Run Copy-AzLocalPipelineExample to create it."
            }
            $settings = ConvertFrom-Yaml -Yaml (Get-Content -LiteralPath $settingsPath -Raw) -Ordered:$false
            if ([int]$settings.schemaVersion -ne 1) {
              throw "Unsupported sideload settings schemaVersion '$($settings.schemaVersion)'; this pipeline requires 1."
            }
            $gateOn = [bool]$settings.enabled
            Write-Host "##vso[task.setvariable variable=enabled;isOutput=true]$($gateOn.ToString().ToLowerInvariant())"

          Append-Summary '## Step.6 - Sideload Updates - Preflight'
          Append-Summary ''

          if (-not $gateOn) {
              Append-Summary '> [!NOTE]'
              Append-Summary '> **Step.6 (Sideload Updates) is OPT-IN and currently OFF.**'
              Append-Summary '>'
                Append-Summary '> `config/sideload-settings.yml` has `enabled: false`. The `Sideload` stage for this run was skipped.'
              Append-Summary ''
              Append-Summary '### How to enable Step.6'
              Append-Summary ''
              Append-Summary '1. **Provision an on-prem self-hosted agent** on the same network as your Azure Local clusters. Add it to a self-hosted POOL and give the agent a custom capability named `azlocal-sideload` (Project Settings -> Agent pools -> <pool> -> <agent> -> Capabilities -> User-defined). See [Self-hosted Windows agents](https://learn.microsoft.com/azure/devops/pipelines/agents/windows-agent).'
              Append-Summary '2. **Replace `<your-self-hosted-pool>` in this YAML** with your pool name (under the `Sideload` stage `pool.name`).'
              Append-Summary '3. **Stage the config files** in your repository under `./config/`:'
              Append-Summary '   - `sideload-settings.yml` (the sole sideload runtime configuration source)'
              Append-Summary '   - `apply-updates-schedule.yml` (the ring-aware apply schedule - generated by Step.3 Schedule Audit)'
              Append-Summary '   - `sideload-auth-map.csv` (per-cluster Key Vault + secret-name map for WinRM credentials)'
              Append-Summary '   - `sideload-catalog.yml` (committed catalog of approved `CombinedSolutionBundle` versions, `Version` -> `DownloadUri` + `Sha256`)'
              Append-Summary '4. **Configure `sideload-settings.yml`**, including the shared UNC state root, copy profile, and task identity.'
              Append-Summary '5. **Configure the service connection** named `AzureLocal-ServiceConnection` (Workload Identity Federation) with read access to your Resource Graph + Key Vault.'
              Append-Summary '6. **Enable the workflow**: set `enabled: true` in `sideload-settings.yml`.'
              Append-Summary ''
              Append-Summary '> [!IMPORTANT]'
              Append-Summary '> Step.6 cannot run on a Microsoft-hosted agent. The job copies multi-GB update media to the cluster `import` SMB share and PowerShell-remotes into a cluster node - both require line-of-sight to the on-prem fabric VLAN and (typically) AD domain membership.'
              Append-Summary ''
              Append-Summary 'See `Automation-Pipeline-Examples/README.md` section 8.6 (Sideload Updates) for the full setup walkthrough.'

              [System.IO.File]::WriteAllLines($summaryPath, $lines)
              Write-Host "##vso[task.uploadsummary]$summaryPath"
              Write-Host '##[warning]Step.6 sideload is disabled in config/sideload-settings.yml.'
              exit 0
          }

          # Gate is ON - validate required configuration.
          Append-Summary '### Master gate'
          Append-Summary ''
          Append-Summary '- `enabled: true` in `config/sideload-settings.yml`'
          Append-Summary ''
          Append-Summary '### Required configuration'
          Append-Summary ''
          $missing = [System.Collections.Generic.List[string]]::new()
          $stateRoot = "$($settings.paths.stateRoot)".Trim()
          if ([string]::IsNullOrWhiteSpace($stateRoot)) {
              [void]$missing.Add('paths.stateRoot')
              Append-Summary '- `paths.stateRoot` - **MISSING** (required shared UNC root)'
          } else {
              Append-Summary "- ``paths.stateRoot`` = ``$stateRoot``"
          }
            $taskLogonType = [string]$settings.identity.task.logonType
            if ($taskLogonType -notin @('ServiceAccount','Password')) {
              [void]$missing.Add('identity.task.logonType (ServiceAccount or Password)')
            }
            if ([string]::IsNullOrWhiteSpace([string]$settings.identity.task.principalUserId)) {
              [void]$missing.Add('identity.task.principalUserId')
            }
            if ($taskLogonType -eq 'Password') {
              foreach ($required in @('passwordKeyVaultName','passwordSecretName')) {
                if ([string]::IsNullOrWhiteSpace([string]$settings.identity.task[$required])) {
                  [void]$missing.Add("identity.task.$required")
                }
              }
            }
          Append-Summary "- ``paths.authMap`` = ``$($settings.paths.authMap)``"
          Append-Summary "- ``paths.catalog`` = ``$($settings.paths.catalog)``"
          Append-Summary "- ``paths.applySchedule`` = ``$($settings.paths.applySchedule)``"
          Append-Summary ''

          if ($missing.Count -gt 0) {
              Append-Summary '> [!CAUTION]'
              Append-Summary "> **Setup incomplete.** Missing required variable(s): ``$($missing -join '`, `')``. The ``Sideload`` stage will not run."
              Append-Summary ''
              Append-Summary 'See `Automation-Pipeline-Examples/README.md` section 8.6 (Sideload Updates) for the full setup walkthrough.'

              [System.IO.File]::WriteAllLines($summaryPath, $lines)
              Write-Host "##vso[task.uploadsummary]$summaryPath"
              Write-Host "##vso[task.logissue type=error]Step.6 preflight failed - required variable(s) not set: $($missing -join ', ')"
              exit 1
          }

          Append-Summary '### Self-hosted agent'
          Append-Summary ''
          Append-Summary '- Verify your self-hosted pool advertises the `azlocal-sideload` capability and has at least one **Online** agent (Project Settings -> Agent pools -> <pool> -> Agents).'
          Append-Summary '- The ADO agent pool API requires `Agent Pools (read)` scope which the pipeline identity does not normally hold, so this preflight cannot enumerate agents automatically.'
          Append-Summary ''
          Append-Summary '> [!TIP]'
          Append-Summary '> **Preflight passed.** The `Sideload` stage will run on your self-hosted pool. If no `azlocal-sideload`-capable agent is online the job will queue for up to the pipeline default (no-time-limit by default; cancel the run if it stays Queued for more than a few minutes).'
          Append-Summary ''

          [System.IO.File]::WriteAllLines($summaryPath, $lines)
          Write-Host "##vso[task.uploadsummary]$summaryPath"

- stage: Sideload
  displayName: 'Step.06 - Sideload Updates (Opt-in)'
  # Wait for preflight to pass before queuing onto the self-hosted pool.
  # If preflight FAILS (missing config), this stage is skipped (`dependsOn` unmet).
  # If preflight succeeds with the gate OFF, this stage is skipped by its own `condition`.
  dependsOn: Preflight
  condition: and(succeeded(), eq(dependencies.Preflight.outputs['PreflightCheck.preflight.enabled'], 'true'))
  jobs:
  - job: AdvanceSideload
    timeoutInMinutes: $(AZLOCAL_EFFECTIVE_PIPELINE_RUNTIME_MINUTES)
    displayName: 'Advance Sideload State Machine'
    # Requires an on-prem self-hosted AGENT (Azure DevOps terminology) on the same
    # network as the clusters, in a POOL whose agents advertise the `azlocal-sideload`
    # capability. Replace '<your-self-hosted-pool>' with your pool name.
    # BEGIN-AZLOCAL-CUSTOMIZE:sideload-runner-AdvanceSideload
    pool:
      name: '<your-self-hosted-pool>'
      demands:
        - azlocal-sideload
    # END-AZLOCAL-CUSTOMIZE:sideload-runner-AdvanceSideload

    steps:
    - checkout: self
      displayName: 'Checkout repository'

    - task: PowerShell@2
      displayName: 'Install AzLocal.UpdateManagement from PSGallery'
      name: moduleVersion
      env:
        REQUIRED_MODULE_VERSION: $(REQUIRED_MODULE_VERSION)
        GENERATED_AGAINST_MODULE_VERSION: $(GENERATED_AGAINST_MODULE_VERSION)
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
          if ($env:REQUIRED_MODULE_VERSION) {
              $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
              Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
          } else {
              Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
          }
          # Transient PSGallery lookups can intermittently fail with "No match was found
          # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
          # (a PSGallery search index / publish-propagation blip). Retry the install up
          # to 25 attempts (~25 min) with capped exponential backoff + jitter (10s, 20s, 40s, 60s cap) to ride out a prolonged PSGallery search-index outage in a single run.
          $installMaxAttempts = 25
          $installAttempt = 0
          while ($true) {
              $installAttempt++
              try {
                Install-Module Az.Accounts -Scope CurrentUser -Force -AllowClobber
                Install-Module Az.KeyVault -Scope CurrentUser -Force -AllowClobber
                  Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
                  Install-Module @installArgs
                  break
              } catch {
                  if ($installAttempt -ge $installMaxAttempts) {
                      Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                      throw
                  }
                  $installRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $installAttempt - 1)) + (Get-Random -Minimum 0 -Maximum 5)
                  Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                  Start-Sleep -Seconds $installRetryDelay
              }
          }
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalPipelineVersionBanner `
              -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
              -PinnedVersion $env:REQUIRED_MODULE_VERSION

    # v0.9.12: fail with a run-summary-visible message when the service
    # connection authenticates but the identity can see zero subscriptions
    # (the cryptic "No subscriptions found for ***"). Runs under AzureCLI@2 so
    # `az account list` is authenticated; placed before the state-machine task
    # so the job fails fast with clear remediation instead of a cascade.
    - task: AzureCLI@2
      displayName: 'Verify Azure subscription access'
      retryCountOnTaskFailure: 2
      inputs:
        # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-AdvanceSideload-subcheck
        azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
        # END-AZLOCAL-CUSTOMIZE:service-connection-AdvanceSideload-subcheck
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          Assert-AzLocalAzureSubscriptionAccess

    - task: AzureCLI@2
      displayName: 'Advance Sideload State Machine'
      # v0.9.1: single retry for the transient OIDC/az-login failure (the
      # service-connection token exchange can intermittently return "JSON is
      # invalid"). The sideload state machine is re-entrant (durable state +
      # heartbeat staleness detection), so a re-run safely resumes.
      retryCountOnTaskFailure: 2
      env:
        INPUT_UPDATE_RING: ${{ parameters.updateRing }}
        INPUT_DRY_RUN: ${{ parameters.dryRun }}
        reportsPath: $(reportsPath)
        DIAGNOSTICS_PARAM: ${{ lower(parameters.diagnostics) }}
        DEBUG_VERBOSE_SETTING: $(DEBUG_VERBOSE)
        BUILD_REASON: $(Build.Reason)
        DIAGNOSTICS_LOG_PATH: $(Build.ArtifactStagingDirectory)/diagnostics/sideload-updates.log
      inputs:
        # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-AdvanceSideload
        azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
        # END-AZLOCAL-CUSTOMIZE:service-connection-AdvanceSideload
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        # addSpnToEnvironment exposes $env:servicePrincipalId / $env:idToken /
        # $env:tenantId so we can also light up an Az PowerShell context for the
        # Key Vault secret read (Get-AzKeyVaultSecret).
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          $diagnosticsEnabled = $env:DEBUG_VERBOSE_SETTING -eq 'true' -or (
              $env:BUILD_REASON -eq 'Manual' -and $env:DIAGNOSTICS_PARAM -eq 'true'
          )
          if ($diagnosticsEnabled) {
              $VerbosePreference = 'Continue'
              $PSDefaultParameterValues['*-AzLocal*:Verbose'] = $true
              New-Item -ItemType Directory -Path (Split-Path -Parent $env:DIAGNOSTICS_LOG_PATH) -Force | Out-Null
              Start-Transcript -Path $env:DIAGNOSTICS_LOG_PATH -Force
              $module = Get-Module AzLocal.UpdateManagement | Sort-Object Version -Descending | Select-Object -First 1
              Write-Host "Diagnostics enabled (trigger=$env:BUILD_REASON; PowerShell=$($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition); module=$($module.Version); path=$($module.Path))."
          }

            $settings = Get-AzLocalSideloadSettings -Path './config/sideload-settings.yml'

          # Establish an Az PowerShell context for the Key Vault credential read.
          # WIF service connection -> federated token. For a secret-based service
          # principal use -ServicePrincipal -Credential; for a self-hosted agent
          # Managed identity environments can use Connect-AzAccount -Identity.
          if ($env:idToken -and $env:servicePrincipalId -and $env:tenantId) {
              Connect-AzAccount -ServicePrincipal `
                  -ApplicationId $env:servicePrincipalId `
                  -Tenant $env:tenantId `
                  -FederatedToken $env:idToken | Out-Null
          }

          # 1. Resolve the per-cluster plan (read-only).
          $planParams = @{
              SchedulePath = [string]$settings.Paths.applySchedule
              AuthMapPath  = [string]$settings.Paths.authMap
              CatalogPath  = [string]$settings.Paths.catalog
              LeadDays     = [int]$settings.Planning.leadDays
          }
          if ($env:INPUT_UPDATE_RING) { $planParams['UpdateRingValue'] = $env:INPUT_UPDATE_RING }
          if ($settings.Remoting.fqdnSuffix) { $planParams['FqdnSuffix'] = [string]$settings.Remoting.fqdnSuffix }
          $plan = @(Resolve-AzLocalSideloadPlan @planParams)
          Write-Host ("Resolved {0} cluster plan row(s)." -f $plan.Count)

          # 2. Advance the re-entrant state machine by one transition per cluster.
          $applyParams = @{
                Plan         = $plan
                StateRoot    = [string]$settings.Paths.stateRoot
                HeartbeatSeconds = [int]$settings.Reconciliation.heartbeatIntervalSeconds
                HeartbeatStaleMinutes = [int]$settings.Reconciliation.heartbeatStaleMinutes
                NoProgressMinutes = [int]$settings.Reconciliation.noProgressMinutes
                MaxConcurrentCopies = [int]$settings.Reconciliation.maxConcurrentCopies
                MaxConcurrentCopiesPerRunner = [int]$settings.Reconciliation.maxConcurrentCopiesPerRunner
                TaskLogonType = [string]$settings.Identity.task.logonType
                TaskPrincipalUserId = [string]$settings.Identity.task.principalUserId
              ErrorAction = 'Stop'
          }
              if ($settings.Paths.cacheRoot) { $applyParams['CacheRoot'] = [string]$settings.Paths.cacheRoot }
              $profile = $settings.Copy.profiles[[string]$settings.Copy.defaultProfile]
              $switches = @("/R:$($profile.retryCount)", "/W:$($profile.waitSeconds)")
              if ([int]$profile.interPacketGapMilliseconds -gt 0) { $switches += "/IPG:$($profile.interPacketGapMilliseconds)" }
              if ([bool]$profile.restartable) { $switches += '/Z' }
              if ([bool]$profile.unbuffered) { $switches += '/J' }
              $applyParams['RobocopySwitches'] = $switches -join ' '
              $taskPassword = $null
              if ([string]$settings.Identity.task.logonType -eq 'Password') {
                  $taskSecret = Get-AzKeyVaultSecret -VaultName ([string]$settings.Identity.task.passwordKeyVaultName) -Name ([string]$settings.Identity.task.passwordSecretName) -ErrorAction Stop
                  $taskPassword = $taskSecret.SecretValue
                  $taskSecret = $null
                $applyParams['TaskPassword'] = $taskPassword
              }
          if ($env:INPUT_DRY_RUN -eq 'true' -or $env:INPUT_DRY_RUN -eq 'True') {
              $applyParams['WhatIf'] = $true
              Write-Host 'DRY RUN MODE - no media staged, no tasks registered, no tags flipped.'
          }
            try {
              $results = @(Invoke-AzLocalSideloadUpdate @applyParams)
            }
            finally {
              $taskPassword = $null
              $applyParams.Remove('TaskPassword')
            }
          Write-Host ("Processed {0} cluster(s)." -f $results.Count)

          # 3. Render the status report (markdown step summary + JUnit XML + sideload-status.md).
          New-Item -ItemType Directory -Path $env:reportsPath -Force | Out-Null
          $report = Add-AzLocalSideloadStepSummary -StateRoot ([string]$settings.Paths.stateRoot) -Plan $plan -OutputPath $env:reportsPath

          if ($report.HasFailures) {
              Write-Host '##vso[task.logissue type=warning]One or more clusters are in a Failed state or have plan errors - see the Sideload status report.'
          }

    - task: PublishPipelineArtifact@1
      displayName: 'Publish verbose diagnostics'
      condition: and(always(), or(eq(variables['DEBUG_VERBOSE'], 'true'), and(eq(variables['Build.Reason'], 'Manual'), eq('${{ lower(parameters.diagnostics) }}', 'true'))))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/diagnostics'
        artifact: 'azlocal-sideload-updates-diagnostics-$(Build.BuildId)-$(System.JobAttempt)'
        publishLocation: 'pipeline'

    # v0.9.12: fail with a run-summary-visible message (instead of the
    # PublishTestResults "No test result files were found" warning) when the
    # state-machine task reported success but wrote no report files.
    - task: PowerShell@2
      displayName: 'Verify diagnostic reports were produced'
      condition: succeeded()
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          Assert-AzLocalPipelineReport -Path '$(reportsPath)/*.xml' -ProducingStepName 'Advance Sideload State Machine'

    - pwsh: |
        $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
        Write-Host "##vso[task.setvariable variable=artifactStamp;isOutput=true]$stamp"
        Write-Host "Artifact timestamp: $stamp"
      displayName: 'Compute Artifact Timestamp'
      condition: always()
      name: stamp

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Sideload Reports'
      condition: always()
      inputs:
        PathtoPublish: '$(reportsPath)'
        ArtifactName: 'azlocal-sideload-updates-report_$(stamp.artifactStamp)'
        publishLocation: 'Container'

    - task: PublishTestResults@2
      displayName: 'Publish Sideload Status as Test Results'
      # v0.9.12: was `condition: always()`; now succeeded()-gated so it skips
      # when an upstream step failed - eliminating the misleading "No test result
      # files were found" warning cascade.
      condition: succeeded()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(reportsPath)/sideload-junit.xml'
        testRunTitle: 'Sideload Update - $(Build.BuildNumber)'
        failTaskOnFailedTests: false

    # v0.9.18: render the support disclaimer at the very bottom of the run summary.
    - task: PowerShell@2
      displayName: 'Support disclaimer'
      condition: always()
      continueOnError: true
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalPipelineSupportFooter
