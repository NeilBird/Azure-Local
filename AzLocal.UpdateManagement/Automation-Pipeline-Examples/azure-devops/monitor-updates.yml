# AZLOCAL-PIPELINE-ID: monitor-updates
# Update: 4 - Monitor In-Flight Updates (Azure DevOps)
# -----------------------------------------------------------
# Reports clusters whose latest update run is currently in flight, with the
# CURRENT STEP each cluster is on and the ELAPSED DURATION of the run. Built
# for operators who want a 30-minute-cadence "what is happening right now"
# view, distinct from the daily Step.9 fleet-update-status snapshot which
# answers "is each cluster up-to-date?".
#
# This pipeline is REPORT-ONLY and always succeeds. Long-running runs are
# surfaced via:
#   - The pipeline summary tab (markdown uploaded via task.uploadsummary).
#   - update-monitor.csv (full per-cluster rows for spreadsheet triage).
#   - update-monitor.xml (JUnit, one <testcase time="0"> per in-flight cluster;
#     <failure> when the elapsed duration exceeds the threshold so the Tests
#     tab shows stuck runs in red).
#
# Data source: Get-AzLocalUpdateRuns -Latest (one row per cluster).
#
# AUTHENTICATION:
# Uses Workload Identity Federation (OIDC) - recommended for secretless authentication.
# See: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure?view=azure-devops#create-an-azure-resource-manager-service-connection-using-workload-identity-federation

# BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
# Edits inside this block are preserved across Update-AzLocalPipelineExample
# module upgrades. Add or modify `schedules:` blocks below.
trigger: none  # Manual or scheduled only

# Default (v0.8.90+): runs every 6 hours, 24x7 (00:00, 06:00, 12:00, 18:00 UTC)
# as a low-cost safety-net heartbeat. The snapshot step runs with -SkipWhenIdle,
# so a heartbeat that finds nothing in flight short-circuits after a single cheap
# Resource Graph probe (no per-cluster sweep) - which is what makes a frequent
# cron affordable. The PRIMARY, low-latency trigger is event-driven: Update: 3
# (Apply Updates) queues this pipeline as soon as it starts >=1 update. Azure
# DevOps cron is ALWAYS UTC - adjust below for your local maintenance window.
# Comment the `schedules:` block out entirely to disable.
#
# ADO does not support sub-hour cron in YAML `schedules:` - the lowest
# cadence is hourly. For sub-hour cadence, use a pipeline trigger from an
# external scheduler (e.g. an Azure Function) that queues this pipeline via REST.
schedules:
  - cron: '0 */6 * * *'
    displayName: 'In-flight update monitor (every 6h, 24x7)'
    branches:
      include:
        - main
    always: true
# END-AZLOCAL-CUSTOMIZE:schedule-triggers

parameters:
  - name: scope
    displayName: 'Scope of clusters to monitor'
    type: string
    default: 'all'
    values:
      - 'all'
      - 'by-update-ring'

  - name: updateRing
    # accepts single ring, 'Prod;Ring2' list, or '***' wildcard (three stars - deliberate).
    displayName: "UpdateRing tag value (only used when scope=by-update-ring). Single, 'Prod;Ring2', or '***'."
    type: string
    default: ''

  - name: longRunningStepHours
    displayName: 'PRIMARY stuck-step signal. Flag in-flight runs whose CURRENT STEP has been running longer than this many hours.'
    type: string
    default: '2'

  - name: longRunningThresholdHours
    displayName: 'Belt-and-braces overall-elapsed flag (default 24h).'
    type: string
    default: '24'

  - name: recentFailureWindowHours
    displayName: 'Surface FAILED runs whose End time falls within the last N hours (0 = disable).'
    type: string
    default: '24'

  - name: criticalElapsedDays
    displayName: 'CRITICAL tier for overall-elapsed (default 3 days). Runs older than this get a :rotating_light: chip; older than 2x get a :skull: chip - strongest visual signal that human intervention is needed.'
    type: string
    default: '3'

  # v0.8.90: performance fast path. When true (default) the snapshot runs with
  # -SkipWhenIdle - one cheap fleet-wide "anything in flight?" probe that short-
  # circuits to an IDLE report when nothing is updating, skipping the per-cluster
  # sweep. Set false to force a full sweep even when idle.
  - name: skipWhenIdle
    displayName: 'Skip the per-cluster sweep when no update runs are in flight (cheap probe only).'
    type: boolean
    default: true

  - name: moduleVersion
    displayName: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
    type: string
    default: ''

  # v0.8.90: machine-set markers for the event-driven trigger queued by
  # Update: 3 (Apply Updates). Operators normally leave these BLANK.
  # triggeredBy=apply-updates enables the optional startup delay
  # ($(MONITOR_TRIGGER_DELAY_MINUTES)) so the monitor lands AFTER updates move
  # past their initial health-check phase. Cron and manual runs leave it blank
  # and never delay. applyRunId back-links to the Apply run (shown in the log).
  - name: triggeredBy
    displayName: 'Marker set by the Apply pipeline for the event-driven trigger (leave blank for manual runs).'
    type: string
    default: ''

  - name: applyRunId
    displayName: 'Run id of the Apply pipeline that triggered this monitor (back-link; leave blank for manual runs).'
    type: string
    default: ''

  # --- ITSM Connector (ServiceNow auto-raise on in-flight monitor failures) ---
  # Set raiseItsmTicket=true to open ServiceNow incidents (v0.8.87) from each
  # stuck-step / failed / attempt-without-run cluster surfaced in
  # update-monitor.xml. Default false so existing schedules stay byte-identical
  # until you opt in. The connector reads the JUnit file this pipeline already
  # produces (update-monitor.xml) and the trigger matrix in
  # ./.itsm/azurelocal-itsm.yml (defaults raise AttemptWithoutRun / StepError /
  # Failed; LongRunningStep / LongRunningOverall are opt-in).
  - name: raiseItsmTicket
    displayName: 'Open ITSM tickets (ServiceNow) for in-flight monitor failures'
    type: boolean
    default: false

  - name: itsmConfigPath
    displayName: 'Path to ITSM matrix config (YAML or JSON)'
    type: string
    default: './.itsm/azurelocal-itsm.yml'

  - name: itsmDryRun
    displayName: 'ITSM: build payloads + run read-only dedupe but do NOT create tickets'
    type: boolean
    default: false

  - name: itsmForceCreate
    displayName: 'ITSM: bypass dedupe and always create new tickets (use with caution)'
    type: boolean
    default: false

variables:
  # Module version this YAML was generated against (per-file stamp; do NOT move to
  # the shared group). The install step compares this to the installed version and
  # to the latest on PSGallery and warns if the YAML looks stale - prompting a
  # refresh via Copy-AzLocalPipelineExample -Update.
  - name: GENERATED_AGAINST_MODULE_VERSION
    value: '0.9.14'
  # Resolution order for the module version pin: queue-time parameter 'moduleVersion'
  # > empty (latest). Leave empty for the default fix-forward behaviour.
  - name: REQUIRED_MODULE_VERSION
    value: '${{ parameters.moduleVersion }}'
  - name: reportsPath
    value: '$(Build.ArtifactStagingDirectory)/reports'
  # Shared, set-once pipeline settings come from the variable group below - the
  # Azure DevOps equivalent of GitHub repo Variables. Set them ONCE in the group
  # and every pipeline picks up the same values:
  #   AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH  (default '')   - optional subscription
  #       exclusion CSV path (repo-relative); when non-empty every Azure Resource
  #       Graph query in this pipeline excludes the listed subscriptions.
  #   MONITOR_TRIGGER_DELAY_MINUTES        (default '0')  - startup delay (minutes)
  #       honoured ONLY when this pipeline is queued by Update: 3 (Apply Updates)
  #       with triggeredBy=apply-updates; otherwise unset/0 = no delay, clamped to
  #       15..240 when set. Cron + manual runs never delay regardless of this value.
  # Create the group once (Library > Variable groups, or
  # `az pipelines variable-group create`). See Automation-Pipeline-Examples/README.md
  # section 5. A variable redefined inline would OVERRIDE the group, so these are
  # intentionally not redefined here - the group is the single source of truth.
  - group: AzureLocal-Pipeline-Settings
  # ITSM connector (opt-in, secrets). When raiseItsmTicket=true the Raise ITSM
  # task below references $(ITSM_SN_INSTANCE_URL), $(ITSM_SN_CLIENT_ID),
  # $(ITSM_SN_CLIENT_SECRET). Bind them via a SEPARATE variable group named
  # 'AzureLocal-ITSM-Secrets' (kept apart because it holds secrets). This block
  # is already list form, so just create that group and uncomment the line below.
  # When raiseItsmTicket=false the Raise ITSM task is skipped and the secrets are
  # not consulted, so this is only required for opt-in users.
  # - group: AzureLocal-ITSM-Secrets

stages:
- stage: MonitorInFlight
  displayName: 'Monitor In-Flight Update Runs'
  jobs:
  - job: Monitor
    displayName: 'Snapshot in-flight update runs'
    # BEGIN-AZLOCAL-CUSTOMIZE:runner-target-Monitor
    pool:
      vmImage: 'windows-latest'
    # END-AZLOCAL-CUSTOMIZE:runner-target-Monitor

    steps:
    - checkout: self
      displayName: 'Checkout repository'

    - task: PowerShell@2
      name: moduleVersionStep
      displayName: 'Install AzLocal.UpdateManagement from PSGallery'
      # v0.8.5 thin-YAML: drift detection + banner + step outputs are all
      # produced by Add-AzLocalPipelineVersionBanner (Public cmdlet).
      env:
        REQUIRED_MODULE_VERSION: $(REQUIRED_MODULE_VERSION)
        GENERATED_AGAINST_MODULE_VERSION: $(GENERATED_AGAINST_MODULE_VERSION)
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
          if ($env:REQUIRED_MODULE_VERSION) {
              $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
              Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
          } else {
              Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
          }
          # Transient PSGallery lookups can intermittently fail with "No match was found
          # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
          # (a PSGallery search index / publish-propagation blip). Retry the install up
          # to 3 attempts with exponential backoff (10s, then 20s) before giving up.
          $installMaxAttempts = 3
          $installAttempt = 0
          while ($true) {
              $installAttempt++
              try {
                  Install-Module @installArgs
                  break
              } catch {
                  if ($installAttempt -ge $installMaxAttempts) {
                      Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                      throw
                  }
                  $installRetryDelay = 10 * [math]::Pow(2, $installAttempt - 1)
                  Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                  Start-Sleep -Seconds $installRetryDelay
              }
          }
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalPipelineVersionBanner `
              -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
              -PinnedVersion $env:REQUIRED_MODULE_VERSION

    # v0.9.12: fail with a run-summary-visible message when the service
    # connection authenticates but the identity can see zero subscriptions
    # (the cryptic "No subscriptions found for ***"). Runs under AzureCLI@2 so
    # `az account list` is authenticated; placed before the (optional) startup
    # delay so the job fails fast with clear remediation instead of sleeping
    # and then cascading.
    - task: AzureCLI@2
      displayName: 'Verify Azure subscription access'
      retryCountOnTaskFailure: 2
      inputs:
        # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-Monitor-subcheck
        azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
        # END-AZLOCAL-CUSTOMIZE:service-connection-Monitor-subcheck
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          Assert-AzLocalAzureSubscriptionAccess

    - task: PowerShell@2
      displayName: 'Startup delay (event-driven trigger only)'
      # Only the Update: 3 (Apply Updates) -> Update: 4 (Monitor) event-driven
      # trigger honours a startup delay, so the monitor lands AFTER updates have
      # had a chance to move past the initial health-check phase. Cron and manual
      # runs NEVER delay (this step is skipped unless triggeredBy=apply-updates).
      # The delay value is read from the pipeline variable
      # MONITOR_TRIGGER_DELAY_MINUTES (override via a variable group or queue-time
      # variable). Unset/0 = no delay; otherwise clamped to 15..240 minutes
      # (guards a typo from holding the agent for hours). The sleep lives HERE (in
      # the monitor), never in Apply, because only one Apply run executes at a
      # time - delaying there would block the next Apply attempt.
      condition: eq('${{ parameters.triggeredBy }}', 'apply-updates')
      env:
        MONITOR_TRIGGER_DELAY_MINUTES: $(MONITOR_TRIGGER_DELAY_MINUTES)
        APPLY_RUN_ID: '${{ parameters.applyRunId }}'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          [int]$delay = 0
          if (-not [int]::TryParse([string]$env:MONITOR_TRIGGER_DELAY_MINUTES, [ref]$delay)) { $delay = 0 }
          if ($delay -le 0) {
              Write-Host 'MONITOR_TRIGGER_DELAY_MINUTES not set (or 0) - no startup delay.'
              return
          }
          if ($delay -lt 15)  { Write-Host "Delay $delay below minimum - clamping to 15.";  $delay = 15 }
          if ($delay -gt 240) { Write-Host "Delay $delay above maximum - clamping to 240."; $delay = 240 }
          Write-Host "Event-driven trigger (apply_run_id=$($env:APPLY_RUN_ID)): sleeping $delay minute(s) before snapshot."
          Start-Sleep -Seconds ($delay * 60)

    - task: AzureCLI@2
      name: snapshot
      displayName: 'Snapshot in-flight update runs'
      # v0.9.1: single retry for the transient OIDC/az-login failure (the
      # service-connection token exchange can intermittently return
      # "JSON is invalid"). This task is read-only/idempotent so a re-run is safe.
      retryCountOnTaskFailure: 2
      # v0.8.5 thin-YAML: the inline run block (cluster scope query via
      # Get-AzLocalUpdateRuns -Latest -PassThru, severity classification,
      # per-cluster CSV, JUnit XML, the six pipeline variables, and the
      # markdown step summary with status badge + in-flight + unresolved-
      # failed tables) has been condensed into the Public cmdlet
      # Export-AzLocalUpdateRunMonitorReport. The cmdlet writes
      # $(reportsPath)/update-monitor.csv + .xml, uploads the markdown
      # summary via ##vso[task.uploadsummary], and sets the seven pipeline
      # variables (in_flight, long_running, long_running_step,
      # step_errored, recent_failures, unresolved_failures,
      # attempts_without_run).
      inputs:
        # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-Monitor
        azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
        # END-AZLOCAL-CUSTOMIZE:service-connection-Monitor
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az extension add --name resource-graph --yes
          Import-Module AzLocal.UpdateManagement -Force
          $params = @{
              Scope                  = "${{ parameters.scope }}"
              OutputDirectory        = "$(reportsPath)"
              InstalledModuleVersion = "$(moduleVersionStep.installed_module_version)"
          }
          if ("${{ parameters.updateRing }}") { $params['UpdateRing'] = "${{ parameters.updateRing }}" }
          [int]$parsed = 0
          if ([int]::TryParse("${{ parameters.longRunningStepHours }}",      [ref]$parsed) -and $parsed -gt 0) { $params['LongRunningStepHours']      = $parsed }
          if ([int]::TryParse("${{ parameters.longRunningThresholdHours }}", [ref]$parsed) -and $parsed -gt 0) { $params['LongRunningThresholdHours'] = $parsed }
          if ([int]::TryParse("${{ parameters.recentFailureWindowHours }}",  [ref]$parsed) -and $parsed -ge 0) { $params['RecentFailureWindowHours']  = $parsed }
          if ([int]::TryParse("${{ parameters.criticalElapsedDays }}",       [ref]$parsed) -and $parsed -gt 0) { $params['CriticalElapsedDays']       = $parsed }
          # v0.8.90: -SkipWhenIdle (cheap idle probe) - the boolean parameter
          # expands to $True / $False at compile time.
          if ($${{ parameters.skipWhenIdle }}) { $params['SkipWhenIdle'] = $true }
          Export-AzLocalUpdateRunMonitorReport @params

    # v0.9.12: fail with a run-summary-visible message (instead of the
    # PublishTestResults "No test result files were found" warning) when the
    # snapshot task reported success but wrote no report files. The idle-skip
    # path still writes an (empty) JUnit file, so this only fires on a genuine
    # zero-output collect.
    - task: PowerShell@2
      displayName: 'Verify diagnostic reports were produced'
      condition: succeeded()
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          Import-Module AzLocal.UpdateManagement -Force
          Assert-AzLocalPipelineReport -Path '$(reportsPath)/*.xml' -ProducingStepName 'Snapshot in-flight update runs'

    # v0.8.95: discoverability notice for the opt-in one-time auto-retry of
    # FAILED updates. Shown only when FAILED_UPDATES_SINGLE_RETRY is NOT enabled,
    # so operators who see failed/stalled runs here learn the capability exists
    # (with the enable instruction + CI/CD README pointer). The monitor never
    # performs retries itself; this is purely informational.
    - task: PowerShell@2
      displayName: 'Failed-update retry availability notice'
      condition: and(always(), ne(variables['FAILED_UPDATES_SINGLE_RETRY'], 'true'))
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          Import-Module AzLocal.UpdateManagement -Force
          Add-AzLocalFailedUpdateRetryHintSummary

    # compute a UTC timestamp variable so every downloadable artifact name is unique per run.
    - pwsh: |
        $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
        Write-Host "##vso[task.setvariable variable=artifactStamp;isOutput=true]$stamp"
        Write-Host "Artifact timestamp: $stamp"
      displayName: 'Compute Artifact Timestamp'
      condition: always()
      name: stamp

    - task: PublishBuildArtifacts@1
      displayName: 'Publish in-flight monitor reports'
      condition: always()
      inputs:
        PathtoPublish: '$(reportsPath)'
        ArtifactName: 'azlocal-update-monitor_$(stamp.artifactStamp)'
        publishLocation: 'Container'

    - task: PublishTestResults@2
      displayName: 'Publish in-flight monitor JUnit'
      # v0.9.12: was `condition: always()`; now succeeded()-gated so it skips
      # when an upstream step failed - eliminating the misleading "No test result
      # files were found" warning cascade.
      condition: succeeded()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(reportsPath)/update-monitor.xml'
        testRunTitle: 'In-Flight Update Monitor'
        mergeTestResults: false
        failTaskOnFailedTests: false

    # ----------------------------------------------------------------------
    # ITSM Connector (ServiceNow auto-raise on in-flight monitor failures)
    #
    # Fully opt-in (gated on parameters.raiseItsmTicket == true). Runs AFTER
    # the JUnit file is published, so the ITSM task is strictly additive -
    # failures here never affect the monitor result (which is always green;
    # this is a report-only pipeline). Reads the same update-monitor.xml that
    # powers the summary. The JUnit emitter writes per-testcase <properties>
    # (ClusterName / ClusterResourceId / UpdateName / Status / CurrentStep /
    # ClusterPortalUrl / UpdateRunPortalUrl) so New-AzLocalIncident can compute
    # the SHA256 dedupe key (one incident per stuck/failed/attempt-gap cluster
    # until it clears) and the Mustache body template can deep-link into the
    # Azure portal.
    # ----------------------------------------------------------------------
    - task: PowerShell@2
      displayName: 'Install powershell-yaml (ITSM config parser)'
      condition: and(succeeded(), eq('${{ parameters.raiseItsmTicket }}', 'true'))
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
              Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          }

    - task: AzureCLI@2
      displayName: 'Raise ITSM tickets'
      name: itsm
      condition: and(succeeded(), eq('${{ parameters.raiseItsmTicket }}', 'true'))
      env:
        # BEGIN-AZLOCAL-CUSTOMIZE:itsm-secrets
        # Bind your ITSM connector secrets from the variable group above.
        # Defaults assume the ServiceNow OAuth client_credentials naming used
        # by azurelocal-itsm.yml (env://ITSM_SN_*). If your secret names differ,
        # update them here - this block is preserved by
        # Update-AzLocalPipelineExample across module upgrades.
        ITSM_SN_INSTANCE_URL: $(ITSM_SN_INSTANCE_URL)
        ITSM_SN_CLIENT_ID: $(ITSM_SN_CLIENT_ID)
        ITSM_SN_CLIENT_SECRET: $(ITSM_SN_CLIENT_SECRET)
        # END-AZLOCAL-CUSTOMIZE:itsm-secrets
      inputs:
        # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-Monitor-2
        azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
        # END-AZLOCAL-CUSTOMIZE:service-connection-Monitor-2
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Import-Module AzLocal.UpdateManagement -Force

          $configPath = "${{ parameters.itsmConfigPath }}"
          $dryRun     = [System.Convert]::ToBoolean("${{ parameters.itsmDryRun }}")
          $force      = [System.Convert]::ToBoolean("${{ parameters.itsmForceCreate }}")

          if (-not (Test-Path $configPath)) {
              Write-Host "##vso[task.logissue type=warning]ITSM config not found at '$configPath' - skipping ticket creation."
              exit 0
          }

          $cfg = Get-AzLocalItsmConfig -Path $configPath

          $junitInput = "$(reportsPath)/update-monitor.xml"
          if (-not (Test-Path $junitInput)) {
              Write-Host "##vso[task.logissue type=warning]No update-monitor.xml found at '$junitInput' - skipping ticket creation."
              exit 0
          }

          $params = @{
              InputArtifactPath = $junitInput
              Config            = $cfg
              RunMetadata       = @{
                  Platform = 'azure-devops'
                  RunId    = $env:BUILD_BUILDID
                  RunUrl   = "$($env:SYSTEM_COLLECTIONURI)$($env:SYSTEM_TEAMPROJECT)/_build/results?buildId=$($env:BUILD_BUILDID)"
                  Branch   = $env:BUILD_SOURCEBRANCH
              }
              DryRun            = $dryRun
              ForceCreate       = $force
              ExportPath        = "$(reportsPath)/itsm-results.csv"
              ExportJUnitPath   = "$(reportsPath)/itsm-results.xml"
          }

          $results = New-AzLocalIncident @params
          $results | Format-Table ClusterName, Action, TicketId, Severity -AutoSize

    - task: PublishBuildArtifacts@1
      displayName: 'Publish ITSM Artefacts'
      condition: and(always(), eq('${{ parameters.raiseItsmTicket }}', 'true'))
      inputs:
        PathtoPublish: '$(reportsPath)'
        ArtifactName: 'azlocal-update-monitor-itsm-results_$(stamp.artifactStamp)'
        publishLocation: 'Container'
      continueOnError: true

    - task: PublishTestResults@2
      displayName: 'Publish ITSM Test Results'
      condition: and(always(), eq('${{ parameters.raiseItsmTicket }}', 'true'))
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(reportsPath)/itsm-results.xml'
        testRunTitle: 'ITSM Tickets (Update: 4 Monitor) - $(Build.BuildNumber)'
        failTaskOnFailedTests: false
