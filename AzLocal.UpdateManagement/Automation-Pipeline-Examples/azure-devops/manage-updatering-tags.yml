# AZLOCAL-PIPELINE-ID: manage-updatering-tags
# Config: 2 - Manage UpdateRing Tags
# This pipeline creates or updates UpdateRing tags on Azure Local clusters from a CSV file
#
# WORKFLOW:
#   1. Run the "Inventory Azure Local Clusters" pipeline first
#   2. Download the CSV artifact from that pipeline run
#   3. Edit the CSV in Excel - populate the 'UpdateRing' column with values (e.g., Wave1, Wave2, Production)
#   4. Commit the edited CSV to your repository (e.g., to a 'config/' folder)
#   5. Run this pipeline and specify the path to your committed CSV file
#
# NOTE: Azure DevOps does not support file uploads as pipeline parameters.
#       The edited CSV must be committed to the repository first.

# BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
# Add or modify `schedules:` blocks here to enable cron-driven runs. Content
# between BEGIN/END markers is preserved by Update-AzLocalPipelineExample
# across module upgrades.
trigger: none
# END-AZLOCAL-CUSTOMIZE:schedule-triggers

parameters:
  - name: csvFilePath
    displayName: 'Path to edited CSV file in repository (e.g., config/ClusterUpdateRings.csv)'
    type: string
    default: 'config/ClusterUpdateRings.csv'
  
  - name: forceOverwrite
    displayName: 'Force overwrite existing UpdateRing tags'
    type: boolean
    default: false
  
  - name: dryRun
    displayName: 'Preview changes without applying (WhatIf mode)'
    type: boolean
    default: true

  - name: moduleVersion
    displayName: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
    type: string
    default: ''

variables:
  # Module version this YAML was generated against (per-file stamp; do NOT move to
  # the shared group). The install step compares this to the installed version and
  # to the latest on PSGallery and warns if the YAML looks stale - prompting a
  # refresh via Copy-AzLocalPipelineExample -Update.
  - name: GENERATED_AGAINST_MODULE_VERSION
    value: '0.9.11'
  # Resolution order for the module version pin: queue-time parameter 'moduleVersion'
  # > empty (latest). Leave empty for the default fix-forward behaviour.
  - name: REQUIRED_MODULE_VERSION
    value: '${{ parameters.moduleVersion }}'
  # Shared, set-once pipeline settings come from the variable group below - the
  # Azure DevOps equivalent of GitHub repo Variables. Set them ONCE in the group
  # and every pipeline picks up the same values:
  #   AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH  (default '')   - optional subscription
  #       exclusion CSV path (repo-relative); when non-empty every Azure Resource
  #       Graph query in this pipeline excludes the listed subscriptions.
  # Create the group once (Library > Variable groups, or
  # `az pipelines variable-group create`). See Automation-Pipeline-Examples/README.md
  # section 5. A variable redefined inline would OVERRIDE the group, so it is
  # intentionally not redefined here - the group is the single source of truth.
  - group: AzureLocal-Pipeline-Settings

# BEGIN-AZLOCAL-CUSTOMIZE:runner-target-pipeline
pool:
  vmImage: 'windows-latest'
# END-AZLOCAL-CUSTOMIZE:runner-target-pipeline

stages:
  - stage: ManageTags
    displayName: 'Config: 2 - Manage UpdateRing Tags'
    jobs:
      - job: ApplyTags
        displayName: 'Apply UpdateRing Tags'
        
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
          
          - task: PowerShell@2
            displayName: 'Validate CSV File Exists'
            # v0.8.5 thin-YAML: the full TWO-STAGE operator workflow guidance
            # is now emitted by Set-AzLocalClusterUpdateRingTagFromCsv when
            # the Apply task runs. This task still fails fast (and surfaces
            # the path) before we spend time installing the module.
            inputs:
              targetType: 'inline'
              script: |
                $csvPath = Join-Path "$(System.DefaultWorkingDirectory)" "${{ parameters.csvFilePath }}"
                if (-not (Test-Path $csvPath)) {
                    Write-Host "##vso[task.logissue type=error]CSV file not found: ${{ parameters.csvFilePath }}"
                    Write-Host "The full TWO-STAGE operator workflow guidance will be emitted by"
                    Write-Host "Set-AzLocalClusterUpdateRingTagFromCsv when the Apply task runs."
                    Write-Host ""
                    Write-Host "Quick recap:"
                    Write-Host "  1. Run Step.1 (Inventory) and download/edit/commit the CSV."
                    Write-Host "  2. Re-run this Step.2 with csvFilePath pointing to the committed CSV."
                    Write-Host ""
                    Write-Host "Docs:"
                    Write-Host "  AzLocal.UpdateManagement/README.md - 'Update Rings' section"
                    Write-Host "  AzLocal.UpdateManagement/Automation-Pipeline-Examples/README.md"
                    exit 1
                }
                Write-Host "Found CSV file: $csvPath"
                Write-Host "##vso[task.setvariable variable=CsvPath]$csvPath"

          - task: PowerShell@2
            displayName: 'Install AzLocal.UpdateManagement from PSGallery'
            name: moduleVersionStep
            # v0.8.5 thin-YAML: drift detection + banner + step outputs are
            # all produced by Add-AzLocalPipelineVersionBanner (Public cmdlet).
            env:
              REQUIRED_MODULE_VERSION: $(REQUIRED_MODULE_VERSION)
              GENERATED_AGAINST_MODULE_VERSION: $(GENERATED_AGAINST_MODULE_VERSION)
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
                if ($env:REQUIRED_MODULE_VERSION) {
                    $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
                    Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
                } else {
                    Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
                }
                Install-Module @installArgs
                Import-Module AzLocal.UpdateManagement -Force
                Add-AzLocalPipelineVersionBanner `
                    -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
                    -PinnedVersion $env:REQUIRED_MODULE_VERSION

          # v0.9.12: fail with a run-summary-visible message when the service
          # connection authenticates but the identity can see zero subscriptions
          # (the cryptic "No subscriptions found for ***"). Runs under AzureCLI@2
          # so `az account list` is authenticated; placed before the tag-apply
          # task so the job fails fast with clear remediation instead of a
          # downstream cascade. This is a write workflow with no JUnit report, so
          # there is no report-presence guard.
          - task: AzureCLI@2
            displayName: 'Verify Azure subscription access'
            retryCountOnTaskFailure: 2
            inputs:
              # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-ApplyTags-subcheck
              azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
              # END-AZLOCAL-CUSTOMIZE:service-connection-ApplyTags-subcheck
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                Import-Module AzLocal.UpdateManagement -Force
                Assert-AzLocalAzureSubscriptionAccess

          - task: AzureCLI@2
            displayName: 'Apply UpdateRing Tags'
            # v0.9.1: single retry for the transient OIDC/az-login failure (the
            # service-connection token exchange can intermittently return "JSON is
            # invalid"). Tag writes are idempotent (re-applying the same UpdateRing
            # value is a no-op), so a re-run is safe.
            retryCountOnTaskFailure: 2
            # v0.8.5 thin-YAML: the inline Set-AzLocalClusterUpdateRingTag
            # invocation, JSON sidecar write, and Generate Summary task have
            # been condensed into the Public cmdlet
            # Set-AzLocalClusterUpdateRingTagFromCsv. The cmdlet writes
            # UpdateRingTag_Results.json into -OutputDirectory, emits the
            # markdown step summary via ##vso[task.uploadsummary], and
            # surfaces the eight pipeline variables (total_count,
            # created_count, updated_count, already_in_sync_count,
            # skipped_count, failed_count, whatif_count, results_json_path).
            inputs:
              # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-ApplyTags
              azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
              # END-AZLOCAL-CUSTOMIZE:service-connection-ApplyTags
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Import-Module AzLocal.UpdateManagement -Force
                $forceOverwrite = [System.Convert]::ToBoolean("${{ parameters.forceOverwrite }}")
                $dryRun         = [System.Convert]::ToBoolean("${{ parameters.dryRun }}")
                $params = @{
                    InputCsvPath           = "$(CsvPath)"
                    OutputDirectory        = "$(Build.ArtifactStagingDirectory)"
                    InstalledModuleVersion = "$(moduleVersionStep.installed_module_version)"
                }
                if ($forceOverwrite) { $params['Force']  = $true }
                if ($dryRun)         { $params['WhatIf'] = $true }
                Set-AzLocalClusterUpdateRingTagFromCsv @params

          # compute a UTC timestamp variable so every downloadable artifact name is unique per run.
          - pwsh: |
              $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
              Write-Host "##vso[task.setvariable variable=artifactStamp;isOutput=true]$stamp"
              Write-Host "Artifact timestamp: $stamp"
            displayName: 'Compute Artifact Timestamp'
            condition: always()
            name: stamp

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Log Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'azlocal-updatering-tag-logs_$(stamp.artifactStamp)'
              publishLocation: 'Container'

