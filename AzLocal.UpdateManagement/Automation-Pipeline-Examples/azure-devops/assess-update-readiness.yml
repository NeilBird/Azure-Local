# AZLOCAL-PIPELINE-ID: assess-update-readiness
# Update: 1 - Assess Update Readiness (Pre-flight go/no-go gate)
# --------------------------------------------------
# Runs Get-AzLocalClusterUpdateReadiness and Test-AzLocalClusterHealth -BlockingOnly
# against a target UpdateRing (or the whole fleet) BEFORE apply-updates.yml runs.
#
# Publishes two JUnit XML diagnostic results to the Azure DevOps Tests tab:
#   - readiness.xml       (one test per cluster; fails if ReadyForUpdate = $false)
#   - health-blocking.xml (one test per cluster; fails if any Critical health failure exists)
#
# CSV artifacts are also attached for spreadsheet triage.
#
# This pipeline is REPORT-ONLY and always succeeds. It surfaces not-ready / unhealthy
# clusters via the Tests tab (JUnit diagnostics), the CSV artifacts, and the job summary - but it
# does NOT block downstream runs. In large fleets, day-to-day environmental issues
# (transient storage noise, a single node out, etc.) routinely affect a small subset of
# clusters; blocking the entire wave for one unhealthy cluster is rarely the desired
# behavior. apply-updates.yml is itself per-cluster scoped, so clusters that are not
# ready will simply no-op there too.
#
# If you want a hard pass/fail signal for a chained gate, read the output variables
# (not_ready, critical_failures - lowercase since v0.8.5) from a downstream pipeline via
# a pipeline resource and apply your own tolerance threshold there.
#
# Remediation of Critical health failures is out of scope for this module - see the module
# README "Assess Readiness and Health BEFORE Applying Updates" section for pointers.
#
# v0.8.5 thin-YAML: the inline run body (inventory + scope-param construction +
# Get-AzLocalClusterUpdateReadiness + Test-AzLocalClusterHealth + combined JUnit XML
# merge + 8-section markdown summary + output variables) is now the
# Export-AzLocalClusterUpdateReadinessReport Public cmdlet. This yml is condensed
# to a few lines per step; the full workload (and its Pester tests) live in the module.

# BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
# Content between BEGIN/END markers is preserved by Update-AzLocalPipelineExample
# across module upgrades.
trigger: none  # Manual or scheduled only
schedules:
  # Daily at 07:00 UTC
  - cron: '17 7 * * *'
    displayName: 'Daily Fleet Update Readiness Check'
    branches:
      include:
        - main
    always: true
# END-AZLOCAL-CUSTOMIZE:schedule-triggers

parameters:
  - name: scope
    displayName: 'Scope of clusters to check'
    type: string
    default: 'by-update-ring'
    values:
      - 'by-update-ring'
      - 'all'

  - name: updateRing
    # accepts single ring, 'Prod;Ring2' list, or '***' wildcard (three stars - deliberate).
    displayName: "UpdateRing tag value (only used when scope=by-update-ring). Single, 'Prod;Ring2', or '***'."
    type: string
    default: 'Wave1'

  - name: moduleVersion
    displayName: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
    type: string
    default: ''

  - name: diagnostics
    displayName: 'Enable bounded verbose diagnostics for this manual run. DEBUG_VERBOSE=true enables diagnostics for every run.'
    type: boolean
    default: false

variables:
  # Module version this YAML was generated against (per-file stamp; do NOT move to
  # the shared group). The install step compares this to the installed version and
  # to the latest on PSGallery and warns if the YAML looks stale - prompting a
  # refresh via Copy-AzLocalPipelineExample -Update.
  - name: GENERATED_AGAINST_MODULE_VERSION
    value: '0.9.28'
  # Resolution order for the module version pin: queue-time parameter 'moduleVersion'
  # > empty (latest). Leave empty for the default fix-forward behaviour.
  - name: REQUIRED_MODULE_VERSION
    value: '${{ parameters.moduleVersion }}'
  - name: artifactsPath
    value: '$(Build.ArtifactStagingDirectory)/readiness-assessment'
  # Shared, set-once pipeline settings come from the variable group below - the
  # Azure DevOps equivalent of GitHub repo Variables. Set them ONCE in the group
  # and every pipeline picks up the same values:
  #   AZLOCAL_EXCLUDED_SUBSCRIPTIONS_PATH  (default '')   - optional subscription
  #       exclusion CSV path (repo-relative); when non-empty every Azure Resource
  #       Graph query in this pipeline excludes the listed subscriptions.
  # Create the group once (Library > Variable groups, or
  # `az pipelines variable-group create`). See Automation-Pipeline-Examples/README.md
  # section 5. A variable redefined inline would OVERRIDE the group, so it is
  # intentionally not redefined here - the group is the single source of truth.
  - group: AzureLocal-Pipeline-Settings
  - name: AZLOCAL_EFFECTIVE_PIPELINE_RUNTIME_MINUTES
    value: $[coalesce(variables['AZLOCAL_MAX_PIPELINE_RUNTIME_MINUTES'], 120)]

# BEGIN-AZLOCAL-CUSTOMIZE:runner-target-pipeline
pool:
  vmImage: 'windows-latest'
# END-AZLOCAL-CUSTOMIZE:runner-target-pipeline

stages:
  - stage: Assess
    displayName: 'Update: 1 - Assess Update Readiness'
    jobs:
      - job: AssessReadiness
        timeoutInMinutes: $(AZLOCAL_EFFECTIVE_PIPELINE_RUNTIME_MINUTES)
        displayName: 'Readiness + blocking health gate'
        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - task: PowerShell@2
            displayName: 'Install AzLocal.UpdateManagement from PSGallery'
            # v0.8.5 thin-YAML: drift detection + banner + output variables are
            # all produced by Add-AzLocalPipelineVersionBanner (Public cmdlet).
            name: moduleVersion
            env:
              REQUIRED_MODULE_VERSION: $(REQUIRED_MODULE_VERSION)
              GENERATED_AGAINST_MODULE_VERSION: $(GENERATED_AGAINST_MODULE_VERSION)
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
                if ($env:REQUIRED_MODULE_VERSION) {
                    $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
                    Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
                } else {
                    Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
                }
                # Transient PSGallery lookups can intermittently fail with "No match was found
                # for the specified search criteria and module name 'AzLocal.UpdateManagement'"
                # (a PSGallery search index / publish-propagation blip). Retry the install up
                # to 25 attempts (~25 min) with capped exponential backoff + jitter (10s, 20s, 40s, 60s cap) to ride out a prolonged PSGallery search-index outage in a single run.
                $installMaxAttempts = 25
                $installAttempt = 0
                while ($true) {
                    $installAttempt++
                    try {
                        Install-Module @installArgs
                        break
                    } catch {
                        if ($installAttempt -ge $installMaxAttempts) {
                            Write-Host "Install-Module failed after $installAttempt attempt(s): $($_.Exception.Message)"
                            throw
                        }
                        $installRetryDelay = [math]::Min(60, 10 * [math]::Pow(2, $installAttempt - 1)) + (Get-Random -Minimum 0 -Maximum 5)
                        Write-Host "Install-Module attempt $installAttempt of $installMaxAttempts failed: $($_.Exception.Message). Retrying in $installRetryDelay second(s)..."
                        Start-Sleep -Seconds $installRetryDelay
                    }
                }
                Import-Module AzLocal.UpdateManagement -Force
                Add-AzLocalPipelineVersionBanner `
                    -GeneratedAgainstVersion $env:GENERATED_AGAINST_MODULE_VERSION `
                    -PinnedVersion $env:REQUIRED_MODULE_VERSION

          # v0.9.12: fail with a run-summary-visible message when the service
          # connection authenticates but the identity can see zero subscriptions
          # (the cryptic "No subscriptions found for ***"). Runs under AzureCLI@2
          # so `az account list` is authenticated; placed before the collect task
          # so the job fails fast with clear remediation instead of a cascade.
          - task: AzureCLI@2
            displayName: 'Verify Azure subscription access'
            retryCountOnTaskFailure: 2
            inputs:
              # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-AssessReadiness-subcheck
              azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
              # END-AZLOCAL-CUSTOMIZE:service-connection-AssessReadiness-subcheck
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                Import-Module AzLocal.UpdateManagement -Force
                Assert-AzLocalAzureSubscriptionAccess

          - task: AzureCLI@2
            displayName: 'Run readiness + blocking health checks'
            # v0.9.1: single retry for the transient OIDC/az-login failure (the
            # service-connection token exchange can intermittently return
            # "JSON is invalid"). This task is read-only/idempotent so a re-run is safe.
            retryCountOnTaskFailure: 2
            # v0.8.5 thin-YAML: the inline run block (inventory + scope param
            # construction + Get-AzLocalClusterUpdateReadiness CSV/XML +
            # Test-AzLocalClusterHealth -BlockingOnly CSV/XML + combined JUnit
            # merge + 8-section markdown step summary + the two output
            # variables (NOT_READY / CRITICAL_FAILURES, now lowercase
            # not_ready / critical_failures) has been condensed into the
            # Public cmdlet Export-AzLocalClusterUpdateReadinessReport. The
            # cmdlet writes $(artifactsPath)/{readiness,health-blocking,assess-readiness}.{csv,xml},
            # emits the markdown summary via task.uploadsummary, and sets the
            # two output variables.
            name: gate
            env:
              INPUT_SCOPE: ${{ parameters.scope }}
              INPUT_UPDATE_RING: ${{ parameters.updateRing }}
              INSTALLED_MODULE_VERSION: $(moduleVersion.installed_module_version)
              ARTIFACTS_PATH: $(artifactsPath)
              # v0.9.1: optional apply-updates schedule (schema v2). When this
              # file exists in the repo, its allowedUpdateVersions allow-list
              # constrains the readiness calc to the updates each ring is
              # permitted to install (per-ring override beats the top-level
              # default; 'Latest' = no constraint). Leave the file absent to keep
              # the default "latest Ready update" behaviour.
              APPLY_UPDATES_SCHEDULE_PATH: ./config/apply-updates-schedule.yml
              DIAGNOSTICS_PARAM: ${{ lower(parameters.diagnostics) }}
              DEBUG_VERBOSE_SETTING: $(DEBUG_VERBOSE)
              BUILD_REASON: $(Build.Reason)
              DIAGNOSTICS_LOG_PATH: $(Build.ArtifactStagingDirectory)/diagnostics/pipeline-transcript.log
              AZLOCAL_PIPELINE_TIMING_PATH: $(Build.ArtifactStagingDirectory)/diagnostics/pipeline-timings.json
            inputs:
              # Replace with your service connection name
              # BEGIN-AZLOCAL-CUSTOMIZE:service-connection-AssessReadiness
              azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
              # END-AZLOCAL-CUSTOMIZE:service-connection-AssessReadiness
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                az extension add --name resource-graph --yes
                Import-Module AzLocal.UpdateManagement -Force
                $diagnosticsEnabled = $env:DEBUG_VERBOSE_SETTING -eq 'true' -or (
                  $env:BUILD_REASON -eq 'Manual' -and $env:DIAGNOSTICS_PARAM -eq 'true'
                )
                if ($diagnosticsEnabled) {
                  $VerbosePreference = 'Continue'
                  $PSDefaultParameterValues['*-AzLocal*:Verbose'] = $true
                  New-Item -ItemType Directory -Path (Split-Path -Parent $env:DIAGNOSTICS_LOG_PATH) -Force | Out-Null
                  Start-Transcript -Path $env:DIAGNOSTICS_LOG_PATH -Force
                  $module = Get-Module AzLocal.UpdateManagement | Sort-Object Version -Descending | Select-Object -First 1
                  Write-Host "Diagnostics enabled (trigger=$env:BUILD_REASON; PowerShell=$($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition); module=$($module.Version); path=$($module.Path))."
                }
                $params = @{
                    Scope                  = if ($env:INPUT_SCOPE) { $env:INPUT_SCOPE } else { 'all' }
                    OutputDirectory        = $env:ARTIFACTS_PATH
                    InstalledModuleVersion = $env:INSTALLED_MODULE_VERSION
                }
                if ($env:INPUT_UPDATE_RING) { $params['UpdateRing'] = $env:INPUT_UPDATE_RING }
                if ($env:APPLY_UPDATES_SCHEDULE_PATH -and (Test-Path -LiteralPath $env:APPLY_UPDATES_SCHEDULE_PATH)) {
                    $params['SchedulePath'] = $env:APPLY_UPDATES_SCHEDULE_PATH
                    Write-Host "Applying update allow-list from schedule: $($env:APPLY_UPDATES_SCHEDULE_PATH)"
                }
                Invoke-AzLocalPipelineTimedOperation -PipelineName 'assess-update-readiness' -StepNumber 20 -StepName 'Assess update readiness' -ScriptBlock {
                  Export-AzLocalClusterUpdateReadinessReport @params
                }

          - task: PublishPipelineArtifact@1
            displayName: 'Publish pipeline performance diagnostics'
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/diagnostics'
              artifact: 'azlocal-assess-update-readiness-diagnostics-$(Build.BuildId)-$(System.JobAttempt)'
              publishLocation: 'pipeline'

          # v0.9.12: fail with a run-summary-visible message (instead of the
          # PublishTestResults "No test result files were found" warning) when the
          # collect task reported success but wrote no report files.
          - task: PowerShell@2
            displayName: 'Verify diagnostic reports were produced'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Import-Module AzLocal.UpdateManagement -Force
                Assert-AzLocalPipelineReport -Path '$(artifactsPath)/*.xml' -ProducingStepName 'Run readiness + blocking health checks'

          - task: PublishTestResults@2
            displayName: 'Publish Update Readiness Assessment (combined)'
            # v0.9.12: was `condition: always()`; now succeeded()-gated so it skips
            # when an upstream step failed - eliminating the misleading "No test
            # result files were found" warning cascade.
            condition: succeeded()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(artifactsPath)/assess-readiness.xml'
              testRunTitle: 'Update Readiness Assessment'
              mergeTestResults: false
              failTaskOnFailedTests: false

          - task: PublishTestResults@2
            displayName: 'Publish Readiness JUnit Diagnostics'
            # v0.9.12: was `condition: always()`; now succeeded()-gated (see above).
            condition: succeeded()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(artifactsPath)/readiness.xml'
              testRunTitle: '[JUnit Debug] Readiness (one test per cluster)'
              mergeTestResults: false
              failTaskOnFailedTests: false

          - task: PublishTestResults@2
            displayName: 'Publish Blocking-Health JUnit Diagnostics'
            # v0.9.12: was `condition: always()`; now succeeded()-gated (see above).
            condition: succeeded()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(artifactsPath)/health-blocking.xml'
              testRunTitle: '[JUnit Debug] Blocking Health Checks (one test per cluster)'
              mergeTestResults: false
              failTaskOnFailedTests: false

          # compute a UTC timestamp variable so every downloadable artifact name is unique per run.
          - pwsh: |
              $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
              Write-Host "##vso[task.setvariable variable=artifactStamp;isOutput=true]$stamp"
              Write-Host "Artifact timestamp: $stamp"
            displayName: 'Compute Artifact Timestamp'
            condition: always()
            name: stamp

          - task: PublishPipelineArtifact@1
            displayName: 'Publish readiness assessment artifacts'
            condition: always()
            inputs:
              targetPath: '$(artifactsPath)'
              artifact: 'azlocal-readiness-assessment-report_$(stamp.artifactStamp)'

          # v0.9.18: render the support disclaimer at the very bottom of the run summary.
          - task: PowerShell@2
            displayName: 'Support disclaimer'
            condition: always()
            continueOnError: true
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                Import-Module AzLocal.UpdateManagement -Force
                Add-AzLocalPipelineSupportFooter
