# Step.5 - Assess Update Readiness (Pre-flight go/no-go gate)
# --------------------------------------------------
# Runs Get-AzLocalClusterUpdateReadiness and Test-AzLocalClusterHealth -BlockingOnly
# against a target UpdateRing (or the whole fleet) BEFORE Step.6_apply-updates.yml runs.
#
# Publishes two JUnit XML diagnostic results to the Azure DevOps Tests tab:
#   - readiness.xml       (one test per cluster; fails if ReadyForUpdate = $false)
#   - health-blocking.xml (one test per cluster; fails if any Critical health failure exists)
#
# CSV artifacts are also attached for spreadsheet triage.
#
# This pipeline is REPORT-ONLY and always succeeds. It surfaces not-ready / unhealthy
# clusters via the Tests tab (JUnit diagnostics), the CSV artifacts, and the job summary - but it
# does NOT block downstream runs. In large fleets, day-to-day environmental issues
# (transient storage noise, a single node out, etc.) routinely affect a small subset of
# clusters; blocking the entire wave for one unhealthy cluster is rarely the desired
# behavior. Step.6_apply-updates.yml is itself per-cluster scoped, so clusters that are not
# ready will simply no-op there too.
#
# If you want a hard pass/fail signal for a chained gate, read the output variables
# (NOT_READY, CRITICAL_FAILURES) from a downstream pipeline via a pipeline resource and
# apply your own tolerance threshold there.
#
# Remediation of Critical health failures is out of scope for this module - see the module
# README "Assess Readiness and Health BEFORE Applying Updates" section for pointers.

# BEGIN-AZLOCAL-CUSTOMIZE:schedule-triggers
# Content between BEGIN/END markers is preserved by Update-AzLocalPipelineExample
# across module upgrades.
trigger: none  # Manual or scheduled only
schedules:
  # Daily at 07:00 UTC
  - cron: '0 7 * * *'
    displayName: 'Daily Fleet Update Readiness Check'
    branches:
      include:
        - main
    always: true
# END-AZLOCAL-CUSTOMIZE:schedule-triggers

parameters:
  - name: scope
    displayName: 'Scope of clusters to check'
    type: string
    default: 'by-update-ring'
    values:
      - 'by-update-ring'
      - 'all'

  - name: updateRing
    # accepts single ring, 'Prod;Ring2' list, or '***' wildcard (three stars - deliberate).
    displayName: "UpdateRing tag value (only used when scope=by-update-ring). Single, 'Prod;Ring2', or '***'."
    type: string
    default: 'Wave1'

  - name: moduleVersion
    displayName: 'Pin AzLocal.UpdateManagement version (empty = latest from PSGallery). See Automation-Pipeline-Examples/README.md section 5 "Optional configuration".'
    type: string
    default: ''

variables:
  # Module version this YAML was generated against. The install step compares this to
  # the version actually installed and to the latest on PSGallery, and emits a warning
  # log if the YAML appears stale - prompting you to refresh via
  # Copy-AzLocalPipelineExample -Update. See Automation-Pipeline-Examples/README.md section 5.
  GENERATED_AGAINST_MODULE_VERSION: '0.7.97'
  # Resolution order for the module version pin (leave all unset to install the latest,
  # which is the default "fix-forward" behaviour): queue-time parameter > pipeline variable
  # 'REQUIRED_MODULE_VERSION' overridden at queue time > empty (latest).
  REQUIRED_MODULE_VERSION: '${{ parameters.moduleVersion }}'
  artifactsPath: '$(Build.ArtifactStagingDirectory)/readiness-assessment'

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Assess
    displayName: 'Assess Update Readiness'
    jobs:
      - job: AssessReadiness
        displayName: 'Readiness + blocking health gate'
        steps:
          - checkout: self
            displayName: 'Checkout repository'

          - task: PowerShell@2
            displayName: 'Install AzLocal.UpdateManagement from PSGallery'
            env:
              REQUIRED_MODULE_VERSION: $(REQUIRED_MODULE_VERSION)
              GENERATED_AGAINST_MODULE_VERSION: $(GENERATED_AGAINST_MODULE_VERSION)
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $installArgs = @{ Name = 'AzLocal.UpdateManagement'; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true }
                if ($env:REQUIRED_MODULE_VERSION) {
                    $installArgs.RequiredVersion = $env:REQUIRED_MODULE_VERSION
                    Write-Host "REQUIRED_MODULE_VERSION is set - pinning install to v$($env:REQUIRED_MODULE_VERSION)."
                } else {
                    Write-Host "REQUIRED_MODULE_VERSION is empty - installing the latest version from PSGallery (default fix-forward behaviour)."
                }
                Install-Module @installArgs
                Import-Module AzLocal.UpdateManagement -Force
                $installed = (Get-Module AzLocal.UpdateManagement | Sort-Object Version -Descending | Select-Object -First 1).Version
                $generated = [version]$env:GENERATED_AGAINST_MODULE_VERSION
                $latest    = (Find-Module -Name AzLocal.UpdateManagement -Repository PSGallery -ErrorAction SilentlyContinue).Version
                Write-Host ""
                Write-Host "Module version summary"
                Write-Host "  Installed on agent        : $installed"
                Write-Host "  YAML generated against    : $generated"
                Write-Host "  Latest on PSGallery       : $(if ($latest) { $latest } else { '(lookup failed - check network)' })"
                Write-Host ""
                Get-Module AzLocal.UpdateManagement | Format-List Name, Version, Path
                # Drift signal 0: the module installed at runtime is OLDER than the version this YAML was generated against. Cmdlets, parameters, or output schemas referenced by this YAML may not exist in the installed module - emitted as a warning because this is the most likely cause of a hard runtime failure later in the job.
                if ($installed -lt $generated) {
                    Write-Host "##vso[task.logissue type=warning]AzLocal.UpdateManagement v$installed is OLDER than the version this pipeline YAML was generated against (v$generated). Cmdlets, parameters, or output schemas referenced by this YAML may not exist in v$installed. Set REQUIRED_MODULE_VERSION to v$generated, or refresh the YAML to match the installed module via 'Copy-AzLocalPipelineExample -Platform AzureDevOps -Update'."
                }
                if ($installed -gt $generated) {
                    $msg = "Pipeline YAML was generated against AzLocal.UpdateManagement v$generated but the agent installed v$installed. Pipeline steps may have been improved in later releases - to refresh, re-run 'Copy-AzLocalPipelineExample -Destination .\pipelines -Platform AzureDevOps -Update' (you will be prompted per file; add -Confirm:`$false to bypass). Pipeline YAMLs are under git so 'git diff' shows exactly what changed before commit."
                    Write-Host "##vso[task.logissue type=warning]$msg"
                }
                if ($latest -and ($latest -gt $installed)) {
                    $msg = "AzLocal.UpdateManagement v$latest is available on PSGallery; this run installed v$installed. Review the module CHANGELOG before bumping REQUIRED_MODULE_VERSION (or clear the pin to install the latest automatically)."
                    Write-Host "##vso[task.logissue type=warning]$msg"
                }

          - task: AzureCLI@2
            displayName: 'Run readiness + blocking health checks'
            inputs:
              # Replace with your service connection name
              azureSubscription: 'AzureLocal-ServiceConnection'  # Update with your service connection name
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az extension add --name resource-graph --yes

                Import-Module AzLocal.UpdateManagement -Force

                $scope = "${{ parameters.scope }}"
                $updateRing = "${{ parameters.updateRing }}"

                $outputDir = "$(artifactsPath)"
                New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

                $readinessCsv = Join-Path $outputDir 'readiness.csv'
                $readinessXml = Join-Path $outputDir 'readiness.xml'
                $healthCsv    = Join-Path $outputDir 'health-blocking.csv'
                $healthXml    = Join-Path $outputDir 'health-blocking.xml'

                # Always fetch inventory so we can build a ResourceId -> UpdateRing
                # map for the per-ring pivot in the markdown summary (cheap ARG round-trip).
                $inventory = Get-AzLocalClusterInventory -PassThru
                $ringByResourceId = @{}
                if ($inventory) {
                    foreach ($inv in $inventory) {
                        $ringValue = if ($inv.UpdateRing) { [string]$inv.UpdateRing } else { '(no ring tag)' }
                        $ringByResourceId[$inv.ResourceId] = $ringValue
                    }
                }

                $scopeParams = @{}
                if ($scope -eq 'by-update-ring' -and $updateRing) {
                    $scopeParams['ScopeByUpdateRingTag'] = $true
                    $scopeParams['UpdateRingValue']      = $updateRing
                    Write-Host "Scope: UpdateRing = $updateRing"
                } else {
                    Write-Host "Scope: all clusters (via inventory)"
                    if (-not $inventory -or $inventory.Count -eq 0) {
                        Write-Warning 'No clusters found in inventory.'
                        Write-Host "##vso[task.setvariable variable=NOT_READY;isOutput=true]0"
                        Write-Host "##vso[task.setvariable variable=CRITICAL_FAILURES;isOutput=true]0"
                        exit 0
                    }
                    $scopeParams['ClusterResourceIds'] = @($inventory | Select-Object -ExpandProperty ResourceId)
                }

                Write-Host ''
                Write-Host '========================================' -ForegroundColor Cyan
                Write-Host 'Step 1: Readiness (Get-AzLocalClusterUpdateReadiness)' -ForegroundColor Cyan
                Write-Host '========================================' -ForegroundColor Cyan

                $readiness = Get-AzLocalClusterUpdateReadiness @scopeParams `
                    -ExportPath $readinessCsv `
                    -PassThru

                $null = Get-AzLocalClusterUpdateReadiness @scopeParams `
                    -ExportPath $readinessXml

                $notReady = @($readiness | Where-Object { $_.ReadyForUpdate -ne $true }).Count
                $total = @($readiness).Count

                Write-Host ''
                Write-Host "Total clusters in scope: $total"
                Write-Host "Not ready for update  : $notReady"

                Write-Host ''
                Write-Host '========================================' -ForegroundColor Cyan
                Write-Host 'Step 2: Blocking health (Test-AzLocalClusterHealth -BlockingOnly)' -ForegroundColor Cyan
                Write-Host '========================================' -ForegroundColor Cyan

                $health = Test-AzLocalClusterHealth @scopeParams `
                    -BlockingOnly `
                    -ExportPath $healthCsv `
                    -PassThru

                $null = Test-AzLocalClusterHealth @scopeParams `
                    -BlockingOnly `
                    -ExportPath $healthXml

                # Merge readiness + blocking-health JUnit XMLs into a single combined
                # report (assess-readiness.xml) so operators get one Tests-tab entry
                # instead of two. The individual XMLs still publish below as
                # [JUnit Debug] entries for parity / drill-down.
                $combinedXml = Join-Path $outputDir 'assess-readiness.xml'
                try {
                    $readinessDoc = [xml](Get-Content -LiteralPath $readinessXml -Raw)
                    $healthDoc    = [xml](Get-Content -LiteralPath $healthXml -Raw)
                    $combinedDoc  = New-Object System.Xml.XmlDocument
                    $declaration  = $combinedDoc.CreateXmlDeclaration('1.0', 'utf-8', $null)
                    $combinedDoc.AppendChild($declaration) | Out-Null
                    $rootElement  = $combinedDoc.CreateElement('testsuites')
                    $rootElement.SetAttribute('name', 'Update Readiness Assessment')
                    $combinedDoc.AppendChild($rootElement) | Out-Null
                    foreach ($srcDoc in @($readinessDoc, $healthDoc)) {
                        $suites = if ($srcDoc.DocumentElement.LocalName -eq 'testsuites') {
                            $srcDoc.DocumentElement.SelectNodes('testsuite')
                        } else {
                            ,$srcDoc.DocumentElement
                        }
                        foreach ($suite in $suites) {
                            $imported = $combinedDoc.ImportNode($suite, $true)
                            $rootElement.AppendChild($imported) | Out-Null
                        }
                    }
                    $combinedDoc.Save($combinedXml)
                    Write-Host "Combined JUnit report: $combinedXml"
                }
                catch {
                    Write-Warning "Failed to build combined JUnit report: $($_.Exception.Message)"
                }

                # Test-AzLocalClusterHealth -PassThru returns one row per cluster
                # (shape: ClusterName, HealthState, Passed, CriticalCount, WarningCount, Failures)
                # NOT a flat list of finding rows. Aggregate from CriticalCount / Failures rather
                # than filtering on a non-existent Severity property (which silently returned 0).
                $criticalSum = ($health | Measure-Object -Property CriticalCount -Sum).Sum
                $critical = if ($criticalSum) { [int]$criticalSum } else { 0 }
                $clustersWithCritical = @($health | Where-Object { [int]$_.CriticalCount -gt 0 }).Count

                Write-Host ''
                Write-Host "Critical findings      : $critical"
                Write-Host "Clusters with Critical : $clustersWithCritical"

                Write-Host "##vso[task.setvariable variable=NOT_READY;isOutput=true]$notReady"
                Write-Host "##vso[task.setvariable variable=CRITICAL_FAILURES;isOutput=true]$clustersWithCritical"

                # Azure DevOps summary markdown - audit-order layout:
                #   1. Header tile (one-line status + scope)
                #   2. Action banner (Action required / All clear)
                #   3. Summary counts
                #   4. Not-Ready cluster table  (blocking findings first)
                #   5. Critical-health cluster table (blocking findings, second priority)
                #   6. Per-UpdateRing pivot (only shown when >1 ring in scope)
                #   7. All-clusters detail table
                #   8. Cross-links to upstream/downstream pipelines
                $summaryPath = Join-Path $outputDir 'summary.md'
                $summaryLines = New-Object 'System.Collections.Generic.List[string]'
                $summaryLines.Add('# Update Readiness Assessment')
                $summaryLines.Add('')

                # 1. Header tile (ASCII safe - no emoji)
                $scopeLabel = $scope
                if ($updateRing) { $scopeLabel = "$scope (UpdateRing = $updateRing)" }
                $readyCount = $total - $notReady
                $statusWord = if ($notReady -gt 0 -or $clustersWithCritical -gt 0) { 'ATTENTION' } else { 'OK' }
                $summaryLines.Add("**[$statusWord]** $total cluster(s) assessed | $readyCount Ready | $notReady Not Ready | $clustersWithCritical with Critical health failures | Scope: $scopeLabel")
                $summaryLines.Add('')

                # 2. Action banner
                if ($notReady -gt 0 -or $clustersWithCritical -gt 0) {
                    $summaryLines.Add("**Action required**: $notReady cluster(s) not ready and/or $clustersWithCritical cluster(s) with Critical health failures. Review the **Not-Ready** and **Critical-health** sections below first; the CSV artifacts in azlocal-readiness-assessment-report_* carry the full per-finding detail. Remediate (hardware vendor SBE / firmware / cluster health) before or alongside the next apply-updates run. **The healthy clusters are safe to proceed** - Step.6_apply-updates.yml is per-cluster scoped.")
                } else {
                    $summaryLines.Add('**All clear**: every cluster in scope is ready for update. Safe to proceed with apply-updates for this ring.')
                }
                $summaryLines.Add('')

                # 3. Summary counts
                $summaryLines.Add('## Summary counts')
                $summaryLines.Add('')
                $summaryLines.Add('| Metric | Count |')
                $summaryLines.Add('|--------|-------|')
                $summaryLines.Add("| Total clusters in scope | $total |")
                $summaryLines.Add("| Not ready for update | $notReady |")
                $summaryLines.Add("| Clusters with Critical health failures | $clustersWithCritical |")
                $summaryLines.Add("| Total Critical findings | $critical |")
                $summaryLines.Add('')

                # 4. Not-Ready cluster table (blocking findings first)
                $notReadyRows = @($readiness | Where-Object { $_.ReadyForUpdate -ne $true })
                if ($notReadyRows.Count -gt 0) {
                    $summaryLines.Add('## Not-Ready clusters (review first)')
                    $summaryLines.Add('')
                    $summaryLines.Add('| Cluster | UpdateRing | Current version | Update state | Health | Blocking reasons |')
                    $summaryLines.Add('|---------|------------|-----------------|--------------|--------|------------------|')
                    foreach ($r in ($notReadyRows | Sort-Object @{Expression={ if ($ringByResourceId.ContainsKey($_.ClusterResourceId)) { $ringByResourceId[$_.ClusterResourceId] } else { 'zzz' } }}, ClusterName)) {
                        $ring = if ($ringByResourceId.ContainsKey($r.ClusterResourceId)) { $ringByResourceId[$r.ClusterResourceId] } else { '-' }
                        $cv = if ($r.CurrentVersion) { $r.CurrentVersion } else { '-' }
                        $br = if ($r.BlockingReasons) { $r.BlockingReasons } else { '-' }
                        $summaryLines.Add("| $($r.ClusterName) | $ring | $cv | $($r.UpdateState) | $($r.HealthState) | $br |")
                    }
                    $summaryLines.Add('')
                }

                # 5. Critical-health cluster table
                $criticalRows = @($health | Where-Object { [int]$_.CriticalCount -gt 0 })
                if ($criticalRows.Count -gt 0) {
                    $summaryLines.Add('## Critical-health clusters')
                    $summaryLines.Add('')
                    $summaryLines.Add('_Cross-link: see **Step.4_fleet-connectivity-status** for connectivity-class failures and **Step.9_fleet-health-status** for the broader Critical/Warning catalog._')
                    $summaryLines.Add('')
                    $summaryLines.Add('| Cluster | UpdateRing | Health state | Critical | Warning |')
                    $summaryLines.Add('|---------|------------|--------------|----------|---------|')
                    foreach ($r in ($criticalRows | Sort-Object @{Expression={[int]$_.CriticalCount}; Descending=$true}, ClusterName)) {
                        $invMatch = $inventory | Where-Object { $_.ClusterName -eq $r.ClusterName } | Select-Object -First 1
                        $ring = if ($invMatch -and $invMatch.UpdateRing) { $invMatch.UpdateRing } else { '-' }
                        $summaryLines.Add("| $($r.ClusterName) | $ring | $($r.HealthState) | $($r.CriticalCount) | $($r.WarningCount) |")
                    }
                    $summaryLines.Add('')
                }

                # 6. Per-UpdateRing pivot (only shown when more than one ring in scope)
                $ringGroups = $readiness | Group-Object @{Expression={ if ($ringByResourceId.ContainsKey($_.ClusterResourceId)) { $ringByResourceId[$_.ClusterResourceId] } else { '(no ring tag)' } }} | Sort-Object Name
                if (@($ringGroups).Count -gt 1) {
                    $summaryLines.Add('## Per UpdateRing breakdown')
                    $summaryLines.Add('')
                    $summaryLines.Add('| UpdateRing | Total | Ready | Not Ready |')
                    $summaryLines.Add('|------------|-------|-------|-----------|')
                    foreach ($g in $ringGroups) {
                        $gReady = @($g.Group | Where-Object { $_.ReadyForUpdate -eq $true }).Count
                        $gNotReady = $g.Count - $gReady
                        $summaryLines.Add("| $($g.Name) | $($g.Count) | $gReady | $gNotReady |")
                    }
                    $summaryLines.Add('')
                }

                # 7. All-clusters detail table (sorted by UpdateRing then ClusterName)
                if ($total -gt 0) {
                    $summaryLines.Add('## All clusters detail')
                    $summaryLines.Add('')
                    $summaryLines.Add('| Cluster | UpdateRing | Current version | Current SBE version | Update state | Health | Ready | Recommended update |')
                    $summaryLines.Add('|---------|------------|-----------------|---------------------|--------------|--------|-------|--------------------|')
                    foreach ($r in ($readiness | Sort-Object @{Expression={ if ($ringByResourceId.ContainsKey($_.ClusterResourceId)) { $ringByResourceId[$_.ClusterResourceId] } else { 'zzz' } }}, ClusterName)) {
                        $ring = if ($ringByResourceId.ContainsKey($r.ClusterResourceId)) { $ringByResourceId[$r.ClusterResourceId] } else { '-' }
                        $cv  = if ($r.CurrentVersion) { $r.CurrentVersion } else { '-' }
                        $csv = if ($r.PSObject.Properties['CurrentSbeVersion'] -and $r.CurrentSbeVersion) { $r.CurrentSbeVersion } else { '-' }
                        $ru  = if ($r.RecommendedUpdate) { $r.RecommendedUpdate } else { '-' }
                        $summaryLines.Add("| $($r.ClusterName) | $ring | $cv | $csv | $($r.UpdateState) | $($r.HealthState) | $($r.ReadyForUpdate) | $ru |")
                    }
                    $summaryLines.Add('')
                }

                # 8. Cross-links to other pipelines
                $summaryLines.Add('## Cross-link to other pipelines')
                $summaryLines.Add('')
                $summaryLines.Add('- **Step.4_fleet-connectivity-status** - root-cause Disconnected / Offline / partial-connectivity findings on the Not-Ready and Critical-health rows above.')
                $summaryLines.Add('- **Step.6_apply-updates** - apply updates to the Ready clusters in this ring (manual run, or wait for the scheduled trigger).')
                $summaryLines.Add('- **Step.7_monitor-updates** - tail in-flight runs once Step.6 has started (auto-trigger on Step.6 completion, or manual).')
                $summaryLines.Add('- **Step.9_fleet-health-status** - broader Critical / Warning health catalog across the whole fleet (not just blocking-only).')
                $summaryLines.Add('')
                $summaryLines.Add('_Note: the **Update Readiness Assessment** entry in the Tests tab is the merged combined view; the [JUnit Debug] entries are diagnostic mirrors for CI/test tooling._')

                ($summaryLines -join [Environment]::NewLine) | Out-File -FilePath $summaryPath -Encoding utf8
                Write-Host "##vso[task.uploadsummary]$summaryPath"
            name: gate

          - task: PublishTestResults@2
            displayName: 'Publish Update Readiness Assessment (combined)'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(artifactsPath)/assess-readiness.xml'
              testRunTitle: 'Update Readiness Assessment'
              mergeTestResults: false
              failTaskOnFailedTests: false

          - task: PublishTestResults@2
            displayName: 'Publish Readiness JUnit Diagnostics'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(artifactsPath)/readiness.xml'
              testRunTitle: '[JUnit Debug] Readiness (one test per cluster)'
              mergeTestResults: false
              failTaskOnFailedTests: false

          - task: PublishTestResults@2
            displayName: 'Publish Blocking-Health JUnit Diagnostics'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(artifactsPath)/health-blocking.xml'
              testRunTitle: '[JUnit Debug] Blocking Health Checks (one test per cluster)'
              mergeTestResults: false
              failTaskOnFailedTests: false

          # compute a UTC timestamp variable so every downloadable artifact name is unique per run.
          - pwsh: |
              $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd_HHmmss')
              Write-Host "##vso[task.setvariable variable=artifactStamp;isOutput=true]$stamp"
              Write-Host "Artifact timestamp: $stamp"
            displayName: 'Compute Artifact Timestamp'
            condition: always()
            name: stamp

          - task: PublishPipelineArtifact@1
            displayName: 'Publish readiness assessment artifacts'
            condition: always()
            inputs:
              targetPath: '$(artifactsPath)'
              artifact: 'azlocal-readiness-assessment-report_$(stamp.artifactStamp)'

